plugins {
    id 'com.android.application'
}

android {
    namespace 'app.jeecbt.focus'
    compileSdk 34

    defaultConfig {
        applicationId "app.jeecbt.focus"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Debug-signed release: installable APK without a private keystore.
    // (Students sideload it; Play Store isn't the goal here.)
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

