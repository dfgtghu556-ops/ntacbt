<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>Someshwar JEE Main CBT Platform</title>
<meta name="description" content="Offline NTA-style JEE Main computer based test platform. Upload Physics, Chemistry and Maths PDFs and get a full 75-question CBT with analytics." />
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{ --font-display:"Manrope","Nunito Sans",sans-serif; }
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  /* Vedantu-inspired brand palette: orange primary on deep indigo */
  --blue:#f26722; --blue-d:#d9531a; --blue-l:#f57c34; --blue-soft:#fff1e8;
  --ink-nav-a:#1b1b4b; --ink-nav-b:#2b2b7a;
  --bg:#fbf7f4; --panel:#ffffff; --ink:#1b1b3a; --muted:#6b6b85; --line:#eadfd7;
  --green:#1e9e57; --red:#d33b3b; --purple:#7a3ec8; --amber:#e0a106;
  --radius:14px; --shadow:0 4px 18px rgba(242,103,34,.12);
  --font:"Nunito Sans","Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
html.dark{
  --bg:#14121c; --panel:#1e1b29; --ink:#f2ece6; --muted:#a79fb5; --line:#332e42;
  --ink-nav-a:#141232; --ink-nav-b:#221f4d;
  --blue-soft:#3a2317; --shadow:0 4px 18px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue-l);text-decoration:none}
h1,h2,h3,h4{margin:0 0 .5rem;line-height:1.25;font-family:var(--font-display);letter-spacing:-.01em}
.hide{display:none !important}
/* ---------- layout ---------- */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,var(--ink-nav-a),var(--ink-nav-b));color:#fff;
  display:flex;align-items:center;gap:12px;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar .brand{font-family:var(--font-display);font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:8px;font-size:16.5px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,var(--blue-l),var(--blue-d));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;font-family:var(--font-display);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar .spacer{flex:1}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 11px;cursor:pointer;transition:.18s}
.iconbtn:hover{background:rgba(255,255,255,.28)}
.iconbtn.offline-btn{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:7px 12px}
.iconbtn.offline-btn.busy{background:rgba(255,255,255,.28);cursor:progress}
.iconbtn.offline-btn.ready{background:rgba(30,158,87,.35)}
.offline-btn .ob-pct{font-variant-numeric:tabular-nums}
.nav{display:flex;gap:4px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;position:sticky;top:50px;z-index:35}
.nav button{background:transparent;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700;font-size:13.5px;transition:.18s}
.nav button.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--blue) 60%,transparent)}
.nav button:hover:not(.active){background:var(--blue-soft);color:var(--blue-l)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g4,.g3,.g2{grid-template-columns:1fr}}
.stat{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
.stat:hover{transform:translateY(-2px);box-shadow:0 10px 26px -14px rgba(20,10,40,.35)}
.heatgrid{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.heatcell{aspect-ratio:1;border-radius:3px;min-width:6px}
@media (max-width:600px){.heatgrid{grid-template-columns:repeat(10,1fr)}}
@media print{
  .topbar,.nav,#offlineBar,.q-actions,.setup-actions,.subject-tabs,button{display:none !important}
  body{background:#fff !important;color:#000 !important}
  .card{box-shadow:none !important;border:1px solid #ccc !important;break-inside:avoid}
  .hero-card{background:#fff !important;color:#000 !important;border:1px solid #ccc !important}
  .hero-card:before,.hero-card:after{display:none !important}
  .hero-card .muted,.hero-card h2{color:#000 !important}
}
.stat .v{font-size:27px;font-weight:800;color:var(--blue-l);font-family:var(--font-display);letter-spacing:-.02em}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-top:3px;font-weight:700}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;transition:.18s;box-shadow:0 2px 8px rgba(11,87,164,.25)}
.btn:hover{background:var(--blue-l);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--blue-l);border:1px solid var(--line);box-shadow:none}
.btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.purple{background:var(--purple)}
.btn.sm{padding:6px 11px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)} .small{font-size:13px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--blue-soft);color:var(--blue-l)}
.badge.g{background:rgba(30,158,87,.15);color:var(--green)} .badge.r{background:rgba(211,59,59,.15);color:var(--red)}
.badge.p{background:rgba(122,62,200,.15);color:var(--purple)} .badge.a{background:rgba(224,161,6,.16);color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.progress{height:9px;background:var(--blue-soft);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-l));transition:width .5s}
input[type=text],input[type=number],input[type=date],select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0}
input:focus,select:focus{border-color:var(--blue-l)}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;transition:.2s;background:var(--panel)}
.drop.ok{border-color:var(--green);background:rgba(30,158,87,.06)}
.drop.warn{border-color:var(--amber);background:rgba(224,161,6,.07)}
.drop.busy{border-color:var(--blue-l)}
/* ---------- exam shell ---------- */
#examView{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
/* ============ Saarthi — AI doubt-solving chat widget ============
   Sits at z-index 55 — automatically covered by #examView (z-index 60)
   during a live timed test, with no extra JS needed, so it can't be used
   as an in-exam aid. Reachable from dashboard/review/library/notebook.
   Opens as a true full-screen panel (like a native chat app) rather than
   a small floating box — easier to use on phones, and unambiguous to
   close (one big header button, plus Escape on desktop). */
.ai-chat-fab{position:fixed;right:20px;bottom:20px;z-index:55;width:58px;height:58px;border-radius:50%;
  border:none;background:linear-gradient(145deg,var(--blue-l),var(--blue-d));color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -4px rgba(217,90,20,.55),0 2px 8px rgba(0,0,0,.15);
  transition:transform .18s,box-shadow .18s}
.ai-chat-fab:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 12px 28px -4px rgba(217,90,20,.6),0 2px 8px rgba(0,0,0,.18)}
.ai-chat-fab:active{transform:scale(.96)}
.ai-chat-fab svg{width:25px;height:25px}
.ai-chat-fab.pulse::before{content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:0 0 0 0 rgba(217,90,20,.55);animation:aiFabPulse 2.2s ease-out infinite}
@keyframes aiFabPulse{0%{box-shadow:0 0 0 0 rgba(217,90,20,.45)}70%{box-shadow:0 0 0 14px rgba(217,90,20,0)}100%{box-shadow:0 0 0 0 rgba(217,90,20,0)}}
.ai-chat-panel{position:fixed;inset:0;z-index:55;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;animation:aiPanelIn .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes aiPanelIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.ai-chat-panel.hide,.ai-chat-fab.hide{display:none}
.ai-chat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;
  background:linear-gradient(100deg,var(--ink-nav-a),var(--ink-nav-b));color:#fff;flex-shrink:0}
.ai-chat-head-id{display:flex;align-items:center;gap:10px;min-width:0}
.ai-close-big{width:38px;height:38px;border-radius:11px;border:none;background:rgba(255,255,255,.12);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.ai-close-big:hover{background:rgba(255,255,255,.22)}
.ai-close-big svg{width:19px;height:19px}
.ai-avatar{width:36px;height:36px;border-radius:11px;flex-shrink:0;background:linear-gradient(140deg,var(--blue-l),var(--blue-d));
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ai-avatar svg{width:19px;height:19px}
.ai-chat-head-id b{font-family:var(--font-display);font-size:15.5px;letter-spacing:-.01em;display:block;line-height:1.25}
.ai-chat-sub{font-size:11.5px;opacity:.8;display:flex;align-items:center;gap:5px;margin-top:1px}
.ai-dot{width:6px;height:6px;border-radius:50%;background:#3ddc84;display:inline-block;box-shadow:0 0 0 2px rgba(61,220,132,.25)}
.ai-chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.ai-chat-msgs>*{max-width:720px;width:100%;margin-left:auto;margin-right:auto}
.ai-chat-msgs::-webkit-scrollbar{width:6px}
.ai-chat-msgs::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.ai-empty{text-align:center;margin:auto 6px;color:var(--muted)}
.ai-empty .ai-avatar{width:56px;height:56px;border-radius:17px;margin:0 auto 14px}
.ai-empty .ai-avatar svg{width:29px;height:29px}
.ai-empty h4{font-family:var(--font-display);color:var(--ink);margin:0 0 4px;font-size:19px}
.ai-empty p{font-size:13.5px;margin:0 0 16px;line-height:1.5}
.ai-starters{display:flex;flex-direction:column;gap:8px}
.ai-starters button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;
  padding:11px 14px;font-size:13.5px;text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:9px}
.ai-starters button:hover{border-color:var(--blue-l);background:var(--blue-soft)}
.ai-msg-row{display:flex;gap:8px;align-items:flex-end;max-width:100% !important}
.ai-msg-row.user{justify-content:flex-end}
.ai-msg-row .ai-avatar{width:26px;height:26px;border-radius:8px;margin-bottom:1px}
.ai-msg-row .ai-avatar svg{width:14px;height:14px}
.ai-msg{max-width:80%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.6;box-shadow:0 1px 2px rgba(0,0,0,.04);
  animation:aiMsgIn .18s ease-out}
@keyframes aiMsgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ai-msg.user{background:linear-gradient(135deg,var(--blue-l),var(--blue-d));color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.ai-msg.model{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.ai-msg.model b{color:var(--blue-d)}
.ai-msg.model ul,.ai-msg.model ol{margin:4px 0;padding-left:20px}
.ai-msg.model li{margin:2px 0}
.ai-msg.model code{background:var(--blue-soft);color:var(--blue-d);padding:1px 5px;border-radius:5px;font-size:.9em}
.ai-msg img.ai-thumb{max-width:100%;border-radius:9px;display:block;margin-bottom:7px}
.ai-file-chip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border-radius:9px;
  padding:7px 10px;margin-bottom:7px;font-size:12.5px}
.ai-msg.model .ai-file-chip{background:var(--blue-soft);color:var(--ink)}
.ai-file-chip svg{width:15px;height:15px;flex-shrink:0}
.ai-typing{display:inline-flex;gap:3px;align-items:center;padding:3px 1px}
.ai-typing i{width:6px;height:6px;border-radius:50%;background:var(--blue-l);opacity:.4;animation:aiTypingBlink 1.1s infinite}
.ai-typing i:nth-child(2){animation-delay:.15s}.ai-typing i:nth-child(3){animation-delay:.3s}
@keyframes aiTypingBlink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.ai-chat-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px;flex-shrink:0;max-width:720px;margin:0 auto;width:100%;box-sizing:border-box}
.ai-chat-chips button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;
  padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}
.ai-chat-chips button:hover{border-color:var(--blue-l);color:var(--blue-d);background:var(--blue-soft)}
.ai-chat-imgprev{padding:10px 16px 0;position:relative;flex-shrink:0;max-width:720px;margin:0 auto;width:100%;box-sizing:border-box}
.ai-chat-imgprev .thumb-wrap{position:relative;display:inline-flex;align-items:center;gap:8px}
.ai-chat-imgprev img{max-height:64px;border-radius:10px;display:block;border:1px solid var(--line)}
.ai-chat-imgprev .filechip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-size:12.5px;max-width:260px}
.ai-chat-imgprev .filechip svg{width:18px;height:18px;flex-shrink:0;color:var(--blue-d)}
.ai-chat-imgprev .filechip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-chat-imgprev button{position:absolute;top:-6px;right:auto;left:-6px;width:20px;height:20px;border-radius:50%;
  border:2px solid var(--bg);background:var(--red,#d33b3b);color:#fff;font-size:11px;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center}
.ai-chat-inputrow{display:flex;gap:7px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-end;
  background:var(--panel);flex-shrink:0}
.ai-chat-inputrow-inner{display:flex;gap:7px;align-items:flex-end;max-width:720px;margin:0 auto;width:100%}
.ai-iconbtn{width:38px;height:38px;flex-shrink:0;border-radius:11px;border:1px solid var(--line);background:var(--bg);
  color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.ai-iconbtn:hover{border-color:var(--blue-l);color:var(--blue-d)}
.ai-iconbtn svg{width:18px;height:18px}
.ai-chat-inputrow textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;
  padding:10px 14px;background:var(--bg);color:inherit;font:inherit;font-size:14.5px;max-height:120px;line-height:1.4}
.ai-chat-inputrow textarea:focus{outline:none;border-color:var(--blue-l);box-shadow:0 0 0 3px var(--blue-soft)}
.ai-send-btn{width:40px;height:40px;flex-shrink:0;border-radius:12px;border:none;cursor:pointer;
  background:linear-gradient(140deg,var(--blue-l),var(--blue-d));color:#fff;display:flex;align-items:center;justify-content:center;
  transition:.15s;box-shadow:0 2px 8px rgba(217,90,20,.35)}
.ai-send-btn svg{width:17px;height:17px}
.ai-send-btn:disabled{background:var(--line);color:var(--muted);cursor:default;box-shadow:none}
.ai-send-btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(217,90,20,.4)}
html.dark .ai-msg.model code{background:rgba(255,255,255,.08)}
@media (prefers-reduced-motion:reduce){.ai-chat-fab.pulse::before,.ai-msg,.ai-chat-panel{animation:none}}
.exam-head{background:linear-gradient(90deg,var(--ink-nav-a),var(--ink-nav-b));color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.timer{background:var(--blue);color:#fff;font-weight:800;border-radius:8px;padding:6px 12px;font-variant-numeric:tabular-nums}
.timer.warn{background:#fff3cd;color:#8a6100} .timer.crit{background:#ffd9d9;color:#a11;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.subtabs{display:flex;gap:6px;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;overflow-x:auto}
.subtabs button{border:1px solid var(--line);background:transparent;border-radius:8px 8px 0 0;padding:7px 16px;font-weight:700;cursor:pointer;color:var(--muted)}
.subtabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.exam-body{flex:1;display:flex;min-height:0}
.qpane{flex:1;overflow:auto;padding:14px}
.palette{width:290px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px}
@media(max-width:860px){
  .exam-body{flex-direction:column}
  .palette{width:auto;max-height:46vh;border-left:0;border-top:1px solid var(--line)}
  .palette.collapsed{display:none}
}
.pal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.pnum{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;transition:.15s;position:relative}
.pnum:hover{transform:scale(1.07)}
.pnum.cur{outline:3px solid var(--blue-l);outline-offset:1px}
.pnum.answered{background:var(--green);color:#fff;border-color:var(--green)}
.pnum.notanswered{background:var(--red);color:#fff;border-color:var(--red)}
.pnum.marked{background:var(--purple);color:#fff;border-color:var(--purple)}
.pnum.markedans{background:var(--purple);color:#fff;border-color:var(--purple)}
.pnum.markedans:after{content:"";position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:50%;background:var(--green);border:1px solid #fff}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:15px;height:15px;border-radius:5px;border:1px solid var(--line);display:inline-block}
.qimg{max-width:100%;display:block;border-radius:8px}
html.dark .qimg{filter:invert(1) hue-rotate(180deg)}
.qtext{white-space:pre-wrap;line-height:1.55;padding:2px 0}
.optrow{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;cursor:pointer;background:var(--panel);transition:.15s}
.optrow:hover{border-color:var(--blue-l);background:var(--blue-soft)}
.optrow.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.optrow.correct{border-color:var(--green);background:rgba(30,158,87,.10)}
.optrow.wrong{border-color:var(--red);background:rgba(211,59,59,.10)}
.optlab{min-width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.optrow.sel .optlab{background:var(--blue);color:#fff;border-color:var(--blue)}
.exam-foot{display:flex;gap:8px;flex-wrap:wrap;padding:10px;border-top:1px solid var(--line);background:var(--panel)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;z-index:200;box-shadow:var(--shadow);animation:fade .25s}
.modal{position:fixed;inset:0;background:rgba(5,15,30,.6);display:grid;place-items:center;z-index:150;padding:16px}
.modal .box{background:var(--panel);border-radius:var(--radius);padding:20px;max-width:520px;width:100%;box-shadow:var(--shadow);animation:fade .25s}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .cell{min-height:52px;padding:4px;border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;position:relative}
.cal .cell.has{background:var(--blue-soft);font-weight:700;cursor:pointer}
.cal .cell.done{background:rgba(30,158,87,.18)}
.cal .cell.today{outline:2px solid var(--blue-l)}
.chip{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line)}
canvas.chart{width:100%;height:210px;display:block}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.heat div{padding:9px;border-radius:9px;font-size:12px;font-weight:600;color:#fff;text-align:center}
.qrev{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--panel)}
.bar{height:8px;border-radius:6px;background:var(--blue-soft);overflow:hidden}
.bar>i{display:block;height:100%}
ul.tight{margin:.3rem 0;padding-left:1.1rem} ul.tight li{margin:.2rem 0}
/* ---- planner (clean, scannable) ---- */
.plan-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:14px}
.plan-summary div{background:var(--blue-soft);border-radius:12px;padding:10px 12px}
.plan-summary b{display:block;font-size:22px;font-weight:900;line-height:1.1}
.plan-summary span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.next-test{background:linear-gradient(135deg,var(--blue-d),var(--blue));color:#fff}
.next-test .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.next-test h3{color:#fff}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding:5px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;margin-bottom:14px}
.ptabs button{flex:1;min-width:104px;border:0;background:transparent;padding:9px 12px;border-radius:10px;
  font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:.15s}
.ptabs button.active{background:var(--blue);color:#fff}
.plan-month{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.prow{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;
  border:1px solid var(--line);border-left:4px solid var(--sub,var(--line));border-radius:12px;
  padding:12px 14px;margin:8px 0;background:var(--panel)}
.prow.done{opacity:.68}
.prow.done .prow-top b{text-decoration:line-through}
.prow-main{min-width:210px;flex:1;display:grid;gap:4px}
.prow-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prow-acts{display:flex;gap:6px;flex-wrap:wrap}
.cal .cell .dots{display:flex;gap:3px;margin-top:3px}
.cal .cell .dots i{width:5px;height:5px;border-radius:50%}
.cal-detail{margin-top:12px}
.formgrid{display:grid;gap:10px}
.formgrid label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.formgrid input,.formgrid textarea{width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;outline:0;font-weight:500;color:var(--ink)}
/* ---- question review (calm, readable) ---- */
.qrev{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:14px;
  margin-bottom:14px;background:var(--panel)}
.qrev.is-correct{border-left-color:var(--green)}
.qrev.is-wrong{border-left-color:var(--red)}
.qrev.is-skipped{border-left-color:var(--amber)}
.qrev-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;
  padding-bottom:10px;border-bottom:1px dashed var(--line);margin-bottom:10px}
.qrev-no{font-weight:900;font-size:15px}
.qrev-ans{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qrev-ans span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:9px;background:var(--blue-soft)}
.qrev-ans span.ok{background:rgba(30,158,87,.15);color:var(--green)}
.qrev-ans span.no{background:rgba(211,59,59,.13);color:var(--red)}
.qrev details{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qrev details summary{cursor:pointer;padding:10px 12px;font-weight:700;font-size:13px;background:var(--blue-soft);list-style:none}
.qrev details summary::-webkit-details-marker{display:none}
.qrev details summary:before{content:"▸ ";}
.qrev details[open] summary:before{content:"▾ ";}
.qrev details .in{padding:12px}
.qrev-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.offline-bar{position:fixed;left:0;right:0;bottom:0;z-index:200;background:var(--amber);color:#1b1b1b;
  font-size:13px;font-weight:700;text-align:center;padding:8px 12px}
/* ---- premium score report (ScoreBooster style) ---- */
.sb-hero{position:relative;overflow:hidden;border-radius:20px;padding:26px;color:#fff;
  background:linear-gradient(135deg,#4c1d95,#5b21b6 45%,#6d28d9);box-shadow:0 18px 40px -22px rgba(76,29,149,.9)}
.sb-hero:after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.08)}
.sb-top{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.sb-hello{font-size:19px;opacity:.9}
.sb-title{font-size:34px;font-weight:900;margin:2px 0 12px;line-height:1.1}
.sb-tag{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
  border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px}
.sb-ring{position:relative;width:150px;height:150px;flex:0 0 auto}
.sb-ring svg{transform:rotate(-90deg)}
.sb-ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.sb-ring .lbl span{font-size:11px;letter-spacing:.14em;opacity:.85;font-weight:800}
.sb-ring .lbl b{font-size:40px;font-weight:900;display:block}
.sb-ring .lbl i{font-style:normal;font-size:12px;opacity:.85}
.sb-oqa{margin-top:22px;position:relative;z-index:1;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
  border-radius:16px;padding:16px}
.sb-oqa h4{margin:0 0 10px;font-size:15px;letter-spacing:.02em}
.sb-oqa .r{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end}
.sb-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.22);margin:12px 0 10px}
.sb-bar i{display:block;height:100%}
.sb-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.sb-legend span{display:flex;align-items:center;gap:6px;font-weight:700}
.sb-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.sb-boost{margin-top:16px;border-radius:20px;overflow:hidden;color:#fff;
  background:linear-gradient(120deg,#f26722,#e11d48 60%,#a21caf);box-shadow:0 18px 40px -24px rgba(225,29,72,.85)}
.sb-boost .in{padding:22px}
.sb-boost .brand{display:inline-flex;align-items:center;gap:0;font-weight:900;border-radius:8px;overflow:hidden;font-size:15px}
.sb-boost .brand em{font-style:normal;background:#6d28d9;padding:4px 9px}
.sb-boost .brand b{background:#fff;color:#1b1b4b;padding:4px 9px}
.sb-boost .line{display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-size:17px;line-height:1.45}
.sb-boost .line .em{font-size:20px;opacity:.9}
.sb-actions{background:var(--panel);color:var(--text);padding:18px;display:grid;gap:12px}
.sb-action{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel)}
.sb-action h5{margin:0 0 4px;font-size:15px}
@media(max-width:650px){.sb-title{font-size:26px}.sb-ring{width:120px;height:120px}.sb-ring .lbl b{font-size:32px}}
.revision-list{display:grid;gap:10px;margin-top:12px}
.revision-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 92%,var(--blue-soft))}
.revision-links{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
.revision-link{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line));border-radius:9px;background:var(--panel);color:var(--blue-d);font-size:12px;font-weight:800}
.revision-link:hover{background:var(--blue-soft);transform:translateY(-1px)}
.ai-shell{padding:0;overflow:hidden;border-color:color-mix(in srgb,var(--blue) 30%,var(--line))}
.ai-hero{padding:20px;background:linear-gradient(120deg,var(--ink-nav-a),var(--ink-nav-b));color:#fff;display:flex;justify-content:space-between;gap:18px;align-items:center}
.ai-hero .muted{color:rgba(255,255,255,.72)}
.ai-score{min-width:112px;text-align:center;padding:12px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(255,255,255,.09)}
.ai-score b{display:block;font-size:28px;color:#fff}
.ai-body{padding:18px}
.ai-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.ai-metric{padding:14px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 90%,var(--blue-soft));position:relative;overflow:hidden}
.ai-metric:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--blue)}
.ai-metric .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.ai-metric .v{font-size:24px;font-weight:900;margin-top:4px}
.ai-panels{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ai-panel{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
.ai-panel h4{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.ai-signal{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:9px 0;font-size:13px}
.ai-signal .bar{grid-column:1/-1;height:6px}.ai-signal .bar i{background:var(--green)}
.ai-panel.warn .ai-signal .bar i{background:var(--amber)}
.ai-recs{margin-top:12px;border-left:4px solid var(--blue);background:var(--blue-soft);padding:12px 14px;border-radius:0 10px 10px 0}
/* mistake / timing tiles + study plan steps */
.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini-grid.two{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:10px}
.mini{background:var(--blue-soft);border:1px solid var(--line);border-radius:11px;padding:9px 10px;display:grid;gap:2px}
.mini .k{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mini b{font-size:19px;font-weight:900;line-height:1.15}
.mini .s{font-size:11px;color:var(--muted);font-weight:600}
.time-rows{display:grid;gap:10px}
.time-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline;font-size:13px;font-weight:700}
.time-row .bar{grid-column:1/-1;height:6px}
.time-row .s{font-weight:600;color:var(--muted);font-size:11px}
.plan-steps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.plan-steps li{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start;font-size:13.5px;line-height:1.45}
.step-n{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:800;
  display:grid;place-items:center}
/* review toolbar + subject sections */
.qrev-bar{position:sticky;top:0;z-index:5;background:var(--card,var(--panel));padding:10px 0 12px;display:grid;gap:9px;
  border-bottom:1px solid var(--line);margin-bottom:14px}
.qtabs{display:flex;gap:6px;overflow-x:auto;background:var(--blue-soft);border-radius:12px;padding:4px}
.qtab{flex:1;min-width:120px;border:0;background:transparent;padding:8px 12px;border-radius:9px;cursor:pointer;
  font-weight:800;font-size:13.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.qtab.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.qtab-n{font-size:11px;font-weight:800;background:rgba(0,0,0,.08);border-radius:999px;padding:1px 7px}
.qtab.active .qtab-n{background:rgba(255,255,255,.24)}
.qtab-w{font-size:11px;font-weight:800;color:var(--red)}
.qtab.active .qtab-w{color:#fff}
.qfilters,.qtools{display:flex;gap:7px;flex-wrap:wrap}
.qtools{justify-content:flex-end}
.btn.warn{background:var(--amber);color:#1b1b1b;border-color:transparent}
.qrev-group{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.qrev-gstats{display:flex;gap:7px;flex-wrap:wrap;font-size:11.5px;font-weight:800}
.qrev-gstats span{padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--muted)}
.qrev-gstats span.ok{background:rgba(30,158,87,.15);color:var(--green)}
.qrev-gstats span.no{background:rgba(211,59,59,.13);color:var(--red)}
/* ---- global accessibility: visible focus everywhere ---- */
:focus-visible{outline:3px solid var(--blue-l,#3b82f6);outline-offset:2px;border-radius:8px}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue-l,#3b82f6);outline-offset:2px}
.skip-link{position:absolute;left:-9999px;top:0;z-index:999;background:var(--blue);color:#fff;padding:10px 16px;
  border-radius:0 0 10px 0;font-weight:800}
.skip-link:focus{left:0}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}
@media(max-width:650px){.revision-item{grid-template-columns:1fr}.revision-links{justify-content:flex-start}.ai-hero{align-items:flex-start}.ai-metrics,.ai-panels{grid-template-columns:1fr}.ai-score{min-width:96px}
  .mini-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.qtab{min-width:96px;font-size:12.5px}.qtools{justify-content:stretch}.qtools .btn{flex:1}}

/* ============================================================
   PERSONALIZATION LAYER — accents, density, font size, card style
   ============================================================ */
html[data-accent="orange"]{--blue:#f26722;--blue-d:#d9531a;--blue-l:#f57c34;--blue-soft:#fff1e8}
html[data-accent="indigo"]{--blue:#4f46e5;--blue-d:#3d35c4;--blue-l:#6d66f0;--blue-soft:#eeedff}
html[data-accent="emerald"]{--blue:#0f9d68;--blue-d:#0b7d53;--blue-l:#17b87c;--blue-soft:#e6f7f0}
html[data-accent="rose"]{--blue:#e0396b;--blue-d:#bd2955;--blue-l:#ef567f;--blue-soft:#ffecf1}
html[data-accent="sky"]{--blue:#0b7ec4;--blue-d:#0a65a0;--blue-l:#1a97e0;--blue-soft:#e7f4fd}
html[data-accent="violet"]{--blue:#7a3ec8;--blue-d:#642fa8;--blue-l:#9257e0;--blue-soft:#f3ecff}
html.dark[data-accent]{--blue-soft:color-mix(in srgb,var(--blue) 22%,#16131f)}
html[data-density="compact"]{--radius:10px}
html[data-density="compact"] .card{padding:11px;margin-bottom:11px}
html[data-density="compact"] .wrap{padding:12px 10px 48px}
html[data-density="compact"] .grid{gap:10px}
html[data-fs="sm"] body{font-size:14px} html[data-fs="lg"] body{font-size:16.5px}
html[data-cards="flat"] .card,html[data-cards="flat"] .stat{box-shadow:none}
html[data-cards="elevated"] .card,html[data-cards="elevated"] .stat{box-shadow:0 14px 34px -18px rgba(20,10,40,.45),0 2px 8px rgba(20,10,40,.06)}
html[data-cards="glass"] .card,html[data-cards="glass"] .stat{
  background:color-mix(in srgb,var(--panel) 72%,transparent);backdrop-filter:blur(16px) saturate(1.25);
  border-color:color-mix(in srgb,var(--blue) 18%,var(--line))}
html[data-cards="glass"] body{background-image:radial-gradient(900px 420px at 8% -8%,color-mix(in srgb,var(--blue) 22%,transparent),transparent 60%),radial-gradient(700px 380px at 100% 0%,color-mix(in srgb,var(--purple) 16%,transparent),transparent 62%);background-attachment:fixed}
html[data-anim="off"] *{animation:none !important;transition:none !important}

/* ---------- premium UI primitives ---------- */
.section-title{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.section-title .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-d);font-size:15px;flex:0 0 auto}
.hero-card{background:linear-gradient(125deg,var(--ink-nav-a),var(--ink-nav-b));color:#fff;border:0;position:relative;overflow:hidden;box-shadow:0 20px 44px -20px rgba(20,10,40,.55)}
.hero-card:after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:color-mix(in srgb,var(--blue) 55%,transparent);filter:blur(70px);top:-140px;right:-90px}
.hero-card:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:color-mix(in srgb,var(--purple) 45%,transparent);filter:blur(80px);bottom:-120px;left:-60px}
.hero-card .muted{color:rgba(255,255,255,.74)}
.hero-card h2{color:#fff;font-family:var(--font-display);font-size:22px}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px;position:relative}
.hero-stats>div{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:11px;backdrop-filter:blur(6px)}
.hero-stats b{display:block;font-size:23px;font-family:var(--font-display);letter-spacing:-.02em}
.hero-stats span{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.72)}
@media(max-width:700px){.hero-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tcard{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);padding:15px;display:flex;flex-direction:column;gap:10px;transition:.2s;box-shadow:var(--shadow)}
.tcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px}
.tcard .foot{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue-d);border:1px solid color-mix(in srgb,var(--blue) 22%,transparent)}
.pill.g{background:rgba(30,158,87,.14);color:var(--green);border-color:rgba(30,158,87,.3)}
.pill.r{background:rgba(211,59,59,.14);color:var(--red);border-color:rgba(211,59,59,.3)}
.pill.a{background:rgba(224,161,6,.16);color:#a87b04;border-color:rgba(224,161,6,.34)}
.pill.n{background:transparent;color:var(--muted);border-color:var(--line)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-top:12px}
.skel{position:relative;overflow:hidden;background:color-mix(in srgb,var(--line) 60%,var(--panel));border-radius:10px;height:14px}
.skel:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--panel) 70%,#fff),transparent);animation:shimmer 1.3s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:6px}
.streak{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.streak i{width:26px;height:26px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:var(--muted)}
.streak i.on{background:var(--blue);color:#fff}
.mastery-row{display:grid;grid-template-columns:minmax(0,1fr) 74px;gap:10px;align-items:center;margin:9px 0}
.mastery-row .bar{grid-column:1/-1}
.donutwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut-legend{display:grid;gap:6px;font-size:13px}
.donut-legend span{display:flex;align-items:center;gap:7px}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--blue);color:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:10px;border:2px solid transparent;cursor:pointer}

<script>
/* ============================================================================
   Someshwar JEE Main CBT Platform — single file, vanilla JS.
   Sections:
     1. Utilities
      2. Storage (private progress locally + public tests in cloud storage)
     3. PDF parsing engine (fixed Vedantu HWT format)
     4. Test model / scoring
     5. Views: Dashboard, Upload, Planner, Analytics, Practice, Search, Result
     6. Exam runtime (NTA-style)
   ========================================================================== */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ------------------------------- 1. UTILS -------------------------------- */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const uid = ()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const fmtTime=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");};
const fmtDate=d=>new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
const todayKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg,ms=2600){const t=el("div","toast",esc(msg));t.setAttribute("role","status");t.setAttribute("aria-live","polite");document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
function confirmBox(title,body,onYes,yesLabel="Yes"){
  const m=el("div","modal");
  m.innerHTML=`<div class="box"><h3>${esc(title)}</h3><p class="muted">${body}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-no>Cancel</button>
    <button class="btn" data-yes>${esc(yesLabel)}</button></div></div>`;
  m.querySelector("[data-no]").onclick=()=>m.remove();
  m.querySelector("[data-yes]").onclick=()=>{m.remove();onYes();};
  document.body.appendChild(m);
}
/** Admin gate for destructive/publishing actions (delete a public test,
 *  publish a new one to the library). Unlocking persists for the rest of
 *  this browser tab session (sessionStorage) so the owner isn't asked
 *  again on every click, but a fresh tab/reload asks again. */
const ADMIN_PASSWORD="#154153s";
function isAdminUnlocked(){ try{ return sessionStorage.getItem("jeecbt.admin")==="1"; }catch(e){ return false; } }
function requireAdmin(action){
  if(isAdminUnlocked()){ action(); return; }
  const m=el("div","modal");
  m.innerHTML=`<div class="box"><h3>🔒 Admin password required</h3>
    <p class="muted">This action changes the public test library — enter the admin password to continue.</p>
    <input type="password" data-pw placeholder="Password" autocomplete="off" style="width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:inherit;font:inherit;margin:6px 0 4px">
    <div class="small" data-err style="color:var(--red);min-height:16px"></div>
    <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn ghost" data-no>Cancel</button>
    <button class="btn" data-yes>Unlock</button></div></div>`;
  document.body.appendChild(m);
  const pwInp=m.querySelector("[data-pw]"), err=m.querySelector("[data-err]");
  pwInp.focus();
  const tryUnlock=()=>{
    if(pwInp.value===ADMIN_PASSWORD){
      try{sessionStorage.setItem("jeecbt.admin","1");}catch(e){}
      m.remove();action();
    }else{ err.textContent="Incorrect password."; pwInp.value=""; pwInp.focus(); }
  };
  m.querySelector("[data-no]").onclick=()=>m.remove();
  m.querySelector("[data-yes]").onclick=tryUnlock;
  pwInp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();tryUnlock();}});
}
const SUBJECTS=["Physics","Chemistry","Mathematics"];
const SUBCOLOR={Physics:"#0b57a4",Chemistry:"#1e9e57",Mathematics:"#7a3ec8"};

/* ------------------------------ 2. STORAGE ------------------------------- */
const LS="jeecbt.v1";
const DB_NAME="jeecbt-img", DB_STORE="img";
let _db=null;
function db(){return _db||(_db=new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(DB_STORE);
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
}));}
async function imgPut(k,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(DB_STORE,"readwrite");t.objectStore(DB_STORE).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function imgGet(k){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(DB_STORE,"readonly").objectStore(DB_STORE).get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
const imgCache=new Map();
async function imgURL(k){if(!k)return null;if(imgCache.has(k))return imgCache.get(k);const v=await imgGet(k);imgCache.set(k,v);return v;}
/** <img> that lazily resolves its IndexedDB source. If there's no image
 *  key (e.g. an AI-fallback-parsed question that has no cropped image),
 *  falls back to rendering plain text instead of a blank <img>. */
function imgTag(key,cls="qimg",fallbackText){
  if(!key && fallbackText) return el("div",cls+" qtext",esc(fallbackText));
  const i=el("img",cls); i.alt="";
  if(key) (key.startsWith("cloud:")?cloudObjectURL(key.slice(6)):imgURL(key)).then(u=>{if(u)i.src=u;});
  return i;
}

const DEFAULT={tests:[],attempts:[],bookmarks:[],planner:[],plannerDone:{},notes:{},studyLog:{},dailyQuestions:{},
  settings:{theme:"system",accent:"orange",density:"comfortable",fontSize:"md",cards:"elevated",anim:"on",candidate:"Candidate",
    negMarking:true,randomizeOrder:false,dailyGoal:20}};
let S = load();
function load(){
  try{
    const saved=Object.assign({},DEFAULT,JSON.parse(localStorage.getItem(LS)||"{}"));
    saved.settings=Object.assign({},DEFAULT.settings,saved.settings||{});
    saved.dailyQuestions=saved.dailyQuestions||{};
    saved.tests=(saved.tests||[]).filter(t=>t.practice);
    return saved;
  }catch(e){return JSON.parse(JSON.stringify(DEFAULT));}
}
function save(){
  try{localStorage.setItem(LS,JSON.stringify({...S,tests:S.tests.filter(t=>t.practice)}));}
  catch(e){toast("Local progress storage is full.");}
}

/* Public test papers live in Lovable Cloud. Results, bookmarks, planner and
   personal progress remain in this browser and are never uploaded. */
let CLOUD=null, cloudTests=[], cloudRefresh=null;
const pendingFiles={Physics:null,Chemistry:null,Mathematics:null};
async function cloudInit(){
  if(CLOUD)return CLOUD;
  const r=await fetch("/api/public/cloud-config");
  if(!r.ok)throw new Error("Cloud storage is unavailable");
  CLOUD=await r.json();return CLOUD;
}
async function cloudFetch(path,options={}){
  const c=await cloudInit();
  const headers=new Headers(options.headers||{});
  headers.set("apikey",c.publishableKey);headers.set("Authorization","Bearer "+c.publishableKey);
  const r=await fetch(c.url+path,{...options,headers});
  if(!r.ok)throw new Error((await r.text())||("Cloud request failed ("+r.status+")"));
  return r;
}
const objectPath=p=>p.split("/").map(encodeURIComponent).join("/");
async function cloudObjectURL(path){
  if(imgCache.has("cloud:"+path))return imgCache.get("cloud:"+path);
  const key="blob:"+path;
  try{
    const r=await cloudFetch("/storage/v1/object/public-tests/"+objectPath(path));
    const blob=await r.blob();
    imgPut(key,blob).catch(()=>{});                 // keep it for offline review
    const u=URL.createObjectURL(blob);imgCache.set("cloud:"+path,u);return u;
  }catch(e){
    const cached=await imgGet(key).catch(()=>null); // no network: serve the saved copy
    if(!cached)throw e;
    const u=URL.createObjectURL(cached);imgCache.set("cloud:"+path,u);return u;
  }
}
/** Re-renders a PDF's pages at a modest resolution and re-saves as a new,
 *  much smaller JPEG-based PDF before archiving it in cloud storage — the
 *  original is only ever kept as a size/reference backup (all actual
 *  question display already uses the separately-cropped JPEGs), so this
 *  trade-off (smaller file, no selectable text in the archived copy) is
 *  free storage savings. Falls back to the original file untouched if
 *  anything goes wrong, so a compression hiccup never blocks an upload. */
async function compressPdfForCloud(file,onProgress){
  try{
    if(typeof jspdf==="undefined") return file;
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    let doc=null;
    for(let n=1;n<=pdf.numPages;n++){
      onProgress&&onProgress(`Compressing page ${n}/${pdf.numPages}…`);
      const pg=await pdf.getPage(n);
      const vp=pg.getViewport({scale:1.3});
      const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;
      const ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
      await pg.render({canvasContext:ctx,viewport:vp}).promise;
      const jpg=cv.toDataURL("image/jpeg",0.55);
      const orient=vp.width>vp.height?"l":"p";
      if(!doc) doc=new jspdf.jsPDF({orientation:orient,unit:"pt",format:[vp.width,vp.height]});
      else doc.addPage([vp.width,vp.height],orient);
      doc.addImage(jpg,"JPEG",0,0,vp.width,vp.height);
    }
    if(!doc) return file;
    const blob=doc.output("blob");
    return blob.size<file.size ? blob : file; // never upload a "compressed" copy that's actually bigger
  }catch(e){ console.warn("PDF compression skipped:",e); return file; }
}
async function uploadObject(path,body,contentType){
  await cloudFetch("/storage/v1/object/public-tests/"+objectPath(path),{
    method:"POST",headers:{"Content-Type":contentType,"x-upsert":"true"},body
  });
}
async function cloudifyTest(test,files,onProgress){
  const copy=structuredClone(test),base=test.id;
  for(const sub of SUBJECTS){
    let f=files[sub];if(!f)throw new Error(sub+" PDF is missing");
    if(Array.isArray(f))f=f[0];   // multiple files were merged for this subject — archive the first as the source reference
    onProgress("Compressing "+sub+" PDF…");
    const small=await compressPdfForCloud(f,onProgress);
    onProgress("Uploading "+sub+" PDF…");
    await uploadObject(`${base}/source/${sub.toLowerCase()}.pdf`,small,"application/pdf");
  }
  const refs=[];
  copy.questions.forEach(q=>{
    if(q.img)refs.push([q,"img",q.img]);if(q.solImg)refs.push([q,"solImg",q.solImg]);
    (q.options||[]).forEach(o=>{if(o.img)refs.push([o,"img",o.img]);});
  });
  for(let i=0;i<refs.length;i++){
    const [owner,key,localKey]=refs[i],data=await imgGet(localKey);
    if(!data)continue;
    const blob=await (await fetch(data)).blob(),path=`${base}/assets/${String(i+1).padStart(4,"0")}.jpg`;
    onProgress(`Uploading test assets ${i+1}/${refs.length}…`);
    await uploadObject(path,blob,"image/jpeg");owner[key]="cloud:"+path;
  }
  return copy;
}
function rowToTest(row){
  const t=row.parsed_test;
  return {...t,id:row.id,name:row.title,createdAt:new Date(row.created_at).getTime(),cloud:true,
    testId:row.test_id,shareSlug:row.share_slug,
    meta:{year:row.exam_year||null,difficulty:row.difficulty||"Moderate",type:row.test_type||"Full Syllabus",
      chapters:row.chapters||[],subjectChapters:row.subject_chapters||{},attempts:row.attempts_count||0,
      durationMin:row.duration_minutes||Math.round((t.duration||10800)/60)}};
}
let OFFLINE=false;
const LIB_CACHE="cache:publicTests";
function setOffline(v){
  if(OFFLINE===v)return; OFFLINE=v;
  const bar=$("#offlineBar");
  if(bar)bar.classList.toggle("hide",!v);
}
async function hydrateFromCache(){
  try{
    const rows=await imgGet(LIB_CACHE);
    if(!rows||!rows.length)return false;
    cloudTests=rows.map(rowToTest);
    S.tests=[...S.tests.filter(t=>t.practice),...cloudTests];
    return true;
  }catch(e){return false;}
}
async function loadPublicTests(silent=false){
  try{
    const r=await cloudFetch("/rest/v1/public_tests?select=*&is_published=eq.true&order=created_at.desc");
    const rows=await r.json(),before=cloudTests.map(t=>t.id+":"+t.createdAt).join("|");
    imgPut(LIB_CACHE,rows).catch(()=>{});          // library stays browsable offline
    setOffline(false);
    cloudTests=rows.map(rowToTest);
    S.tests=[...S.tests.filter(t=>t.practice),...cloudTests];
    const changed=before!==cloudTests.map(t=>t.id+":"+t.createdAt).join("|");
    if(!silent||(changed&&(route==="dash"||route==="library")))render();
    const slug=new URLSearchParams(location.search).get("test");
    if(slug&&!window.__sharedTestOpened){const t=cloudTests.find(x=>x.shareSlug===slug);if(t){window.__sharedTestOpened=true;startExam(t.id);}}
  }catch(e){
    setOffline(true);
    const ok=await hydrateFromCache();
    if(ok)render();
    if(!silent)toast(ok?"Offline — showing the saved Test Library":"Offline and nothing saved yet");
  }
}

/* One-tap offline download: walks every public test's questions/options,
   pulls each referenced diagram through the existing cloudObjectURL()
   path (which already writes it into IndexedDB as a side effect), and
   also asks the service worker to freshen its cache of the app shell.
   After this the whole library — not just questions you've already
   opened — works with the network off. */
const OFFLINE_READY_KEY="jeecbt.offlineReadyAt";
function collectImageRefs(tests){
  const refs=new Set();
  tests.forEach(t=>(t.questions||[]).forEach(q=>{
    if(q.img&&q.img.startsWith("cloud:"))refs.add(q.img.slice(6));
    if(q.solImg&&q.solImg.startsWith("cloud:"))refs.add(q.solImg.slice(6));
    (q.options||[]).forEach(o=>{if(o.img&&o.img.startsWith("cloud:"))refs.add(o.img.slice(6));});
  }));
  return [...refs];
}
async function downloadAllForOffline(onProgress){
  try{ await loadPublicTests(true); }catch(e){ /* fine if we only have what's already cached */ }
  const refs=collectImageRefs(cloudTests);
  let done=0;
  onProgress(done,refs.length);
  for(const path of refs){
    try{ await cloudObjectURL(path); }catch(e){ /* skip assets we truly can't reach right now */ }
    done++; onProgress(done,refs.length);
  }
  if("serviceWorker" in navigator){
    try{
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg)await reg.update();
      await caches.open("eklavya-cbt-v1").then(c=>c.add("/jee-cbt.html"));
    }catch(e){}
  }
  localStorage.setItem(OFFLINE_READY_KEY,String(Date.now()));
  return {tests:cloudTests.length,images:refs.length};
}
function initOfflineDownloadButton(){
  const btn=$("#offlineDlBtn"),label=$("#offlineDlLabel");
  if(!btn)return;
  const lastReady=localStorage.getItem(OFFLINE_READY_KEY);
  if(lastReady){btn.classList.add("ready");label.textContent="Offline ready ✓";}
  btn.onclick=async()=>{
    if(btn.classList.contains("busy"))return;
    btn.classList.remove("ready");btn.classList.add("busy");
    label.textContent="Starting…";
    try{
      const result=await downloadAllForOffline((done,total)=>{
        label.textContent=total?`Caching ${done}/${total}`:"Caching test data…";
      });
      btn.classList.remove("busy");btn.classList.add("ready");
      label.textContent="Offline ready ✓";
      toast(`${result.tests} test(s) and ${result.images} image(s) saved for offline use.`);
    }catch(e){
      btn.classList.remove("busy");
      label.textContent="Make offline";
      toast("Couldn't finish downloading — check your connection and try again.");
    }
  };
}

async function publishPublicTest(test,files,onProgress,meta={}){
  const publicTest=await cloudifyTest(test,files,onProgress);
  onProgress("Publishing test to the public library…");
  const subjectChapters=meta.subjectChapters||test.chapter||{};
  const chapters=[...new Set(Object.values(subjectChapters).join(",").split(/[,;•|]/).map(x=>x.trim()).filter(Boolean))];
  const payload={id:test.id,title:test.name,physics_pdf_path:`${test.id}/source/physics.pdf`,
    chemistry_pdf_path:`${test.id}/source/chemistry.pdf`,mathematics_pdf_path:`${test.id}/source/mathematics.pdf`,
    parsed_test:publicTest,question_count:test.questions.length,duration_minutes:Math.round(test.duration/60),
    exam_year:meta.year||new Date().getFullYear(),difficulty:meta.difficulty||"Moderate",
    test_type:meta.type||"Full Syllabus",chapters,subject_chapters:subjectChapters};
  const r=await cloudFetch("/rest/v1/public_tests",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(payload)});
  return rowToTest((await r.json())[0]);
}
/** Public counter — increments only the attempt tally of a published test. */

/** Only local tweaks (a shifted date, a renamed slot) and "done" ticks are per-device. */
function plannerEdits(){return S.plannerEdits||(S.plannerEdits={});}
function PLAN(){
  const e=plannerEdits();
  return BUILTIN_PLAN.map(r=>{
    const p=e[r.id]||{};
    return {...r,date:p.date||r.date,time:p.time||r.time,name:p.name||r.name,
      topics:(p.topics!=null?p.topics:(r.topics||[]).join("; ")),
      edited:!!(p.date||p.time||p.name||p.topics!=null),
      done:!!(S.plannerDone||{})[r.id]};
  });
}
function setPlannerDone(r,v){
  S.plannerDone=S.plannerDone||{};
  if(v)S.plannerDone[r.id]=true; else delete S.plannerDone[r.id];
  save();
}
/** Dates and slots do move — this lets a student correct a row on their device. */
function editPlannerRow(r,after){
  const m=el("div","modal");
  m.innerHTML=`<div class="box"><h3>Edit this test slot</h3>
    <div class="small muted" style="margin-bottom:10px">Saved on this device only — the shared planner stays intact.</div>
    <div class="formgrid">
      <label>Test name<input type="text" data-k="name" value="${esc(r.name)}"></label>
      <label>Date<input type="date" data-k="date" value="${esc(String(r.date).slice(0,10))}"></label>
      <label>Time slot<input type="text" data-k="time" value="${esc(r.time||"")}"></label>
      <label>Topics<textarea data-k="topics" rows="3">${esc(r.topics||"")}</textarea></label>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:14px;flex-wrap:wrap">
      <button class="btn sm ghost" data-reset>Reset to original</button>
      <button class="btn sm ghost" data-no>Cancel</button>
      <button class="btn sm" data-yes>Save changes</button></div></div>`;
  const val=k=>m.querySelector(`[data-k="${k}"]`).value.trim();
  m.querySelector("[data-no]").onclick=()=>m.remove();
  m.querySelector("[data-reset]").onclick=()=>{delete plannerEdits()[r.id];save();m.remove();toast("Slot restored");after&&after();};
  m.querySelector("[data-yes]").onclick=()=>{
    const base=BUILTIN_PLAN.find(x=>x.id===r.id)||{},patch={};
    const d=val("date"); if(d&&d!==String(base.date).slice(0,10))patch.date=d+"T00:00:00";
    if(val("time")&&val("time")!==base.time)patch.time=val("time");
    if(val("name")&&val("name")!==base.name)patch.name=val("name");
    if(val("topics")!==(base.topics||[]).join("; "))patch.topics=val("topics");
    if(Object.keys(patch).length)plannerEdits()[r.id]=patch; else delete plannerEdits()[r.id];
    save();m.remove();toast("Schedule updated on this device");after&&after();
  };
  document.body.appendChild(m);
}
function shareTest(t){
  const url=location.origin+location.pathname+"?test="+encodeURIComponent(t.shareSlug);
  navigator.clipboard.writeText(url).then(()=>toast("Public test link copied"),()=>prompt("Copy this public test link",url));
}
