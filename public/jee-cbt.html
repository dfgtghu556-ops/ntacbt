<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>Eklavya JEE Main CBT Platform</title>
<meta name="description" content="Offline NTA-style JEE Main computer based test platform. Upload Physics, Chemistry and Maths PDFs and get a full 75-question CBT with analytics." />
<link rel="icon" href="/favicon.ico" />
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  /* Vedantu-inspired brand palette: orange primary on deep indigo */
  --blue:#f26722; --blue-d:#d9531a; --blue-l:#f57c34; --blue-soft:#fff1e8;
  --ink-nav-a:#1b1b4b; --ink-nav-b:#2b2b7a;
  --bg:#fbf7f4; --panel:#ffffff; --ink:#1b1b3a; --muted:#6b6b85; --line:#eadfd7;
  --green:#1e9e57; --red:#d33b3b; --purple:#7a3ec8; --amber:#e0a106;
  --radius:14px; --shadow:0 4px 18px rgba(242,103,34,.12);
  --font:"Nunito Sans","Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
html.dark{
  --bg:#14121c; --panel:#1e1b29; --ink:#f2ece6; --muted:#a79fb5; --line:#332e42;
  --ink-nav-a:#141232; --ink-nav-b:#221f4d;
  --blue-soft:#3a2317; --shadow:0 4px 18px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue-l);text-decoration:none}
h1,h2,h3,h4{margin:0 0 .5rem;line-height:1.25}
.hide{display:none !important}
/* ---------- layout ---------- */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(90deg,var(--ink-nav-a),var(--ink-nav-b));color:#fff;
  display:flex;align-items:center;gap:12px;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar .brand{font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px;font-size:16px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,var(--blue-l),var(--blue-d));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.topbar .spacer{flex:1}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:7px 11px;cursor:pointer;transition:.18s}
.iconbtn:hover{background:rgba(255,255,255,.28)}
.nav{display:flex;gap:4px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;position:sticky;top:50px;z-index:35}
.nav button{background:transparent;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600;transition:.18s}
.nav button.active{background:var(--blue);color:#fff}
.nav button:hover:not(.active){background:var(--blue-soft);color:var(--blue-l)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g4,.g3,.g2{grid-template-columns:1fr}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.stat .v{font-size:26px;font-weight:800;color:var(--blue-l)}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;transition:.18s;box-shadow:0 2px 8px rgba(11,87,164,.25)}
.btn:hover{background:var(--blue-l);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--blue-l);border:1px solid var(--line);box-shadow:none}
.btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.purple{background:var(--purple)}
.btn.sm{padding:6px 11px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)} .small{font-size:13px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--blue-soft);color:var(--blue-l)}
.badge.g{background:rgba(30,158,87,.15);color:var(--green)} .badge.r{background:rgba(211,59,59,.15);color:var(--red)}
.badge.p{background:rgba(122,62,200,.15);color:var(--purple)} .badge.a{background:rgba(224,161,6,.16);color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.progress{height:9px;background:var(--blue-soft);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue-l));transition:width .5s}
input[type=text],input[type=number],input[type=date],select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0}
input:focus,select:focus{border-color:var(--blue-l)}
.drop{border:2px dashed var(--line);border-radius:var(--radius);padding:20px;text-align:center;transition:.2s;background:var(--panel)}
.drop.ok{border-color:var(--green);background:rgba(30,158,87,.06)}
.drop.busy{border-color:var(--blue-l)}
/* ---------- exam shell ---------- */
#examView{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column}
.exam-head{background:linear-gradient(90deg,var(--ink-nav-a),var(--ink-nav-b));color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.timer{background:var(--blue);color:#fff;font-weight:800;border-radius:8px;padding:6px 12px;font-variant-numeric:tabular-nums}
.timer.warn{background:#fff3cd;color:#8a6100} .timer.crit{background:#ffd9d9;color:#a11;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.subtabs{display:flex;gap:6px;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px;overflow-x:auto}
.subtabs button{border:1px solid var(--line);background:transparent;border-radius:8px 8px 0 0;padding:7px 16px;font-weight:700;cursor:pointer;color:var(--muted)}
.subtabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.exam-body{flex:1;display:flex;min-height:0}
.qpane{flex:1;overflow:auto;padding:14px}
.palette{width:290px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px}
@media(max-width:860px){
  .exam-body{flex-direction:column}
  .palette{width:auto;max-height:46vh;border-left:0;border-top:1px solid var(--line)}
  .palette.collapsed{display:none}
}
.pal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}
.pnum{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;transition:.15s;position:relative}
.pnum:hover{transform:scale(1.07)}
.pnum.cur{outline:3px solid var(--blue-l);outline-offset:1px}
.pnum.answered{background:var(--green);color:#fff;border-color:var(--green)}
.pnum.notanswered{background:var(--red);color:#fff;border-color:var(--red)}
.pnum.marked{background:var(--purple);color:#fff;border-color:var(--purple)}
.pnum.markedans{background:var(--purple);color:#fff;border-color:var(--purple)}
.pnum.markedans:after{content:"";position:absolute;right:3px;bottom:3px;width:9px;height:9px;border-radius:50%;background:var(--green);border:1px solid #fff}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:15px;height:15px;border-radius:5px;border:1px solid var(--line);display:inline-block}
.qimg{max-width:100%;display:block;border-radius:8px}
html.dark .qimg{filter:invert(1) hue-rotate(180deg)}
.optrow{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;cursor:pointer;background:var(--panel);transition:.15s}
.optrow:hover{border-color:var(--blue-l);background:var(--blue-soft)}
.optrow.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1px var(--blue)}
.optrow.correct{border-color:var(--green);background:rgba(30,158,87,.10)}
.optrow.wrong{border-color:var(--red);background:rgba(211,59,59,.10)}
.optlab{min-width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px}
.optrow.sel .optlab{background:var(--blue);color:#fff;border-color:var(--blue)}
.exam-foot{display:flex;gap:8px;flex-wrap:wrap;padding:10px;border-top:1px solid var(--line);background:var(--panel)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;z-index:200;box-shadow:var(--shadow);animation:fade .25s}
.modal{position:fixed;inset:0;background:rgba(5,15,30,.6);display:grid;place-items:center;z-index:150;padding:16px}
.modal .box{background:var(--panel);border-radius:var(--radius);padding:20px;max-width:520px;width:100%;box-shadow:var(--shadow);animation:fade .25s}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .cell{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;position:relative}
.cal .cell.has{background:var(--blue-soft);font-weight:700;cursor:pointer}
.cal .cell.done{background:rgba(30,158,87,.18)}
.cal .cell.today{outline:2px solid var(--blue-l)}
.chip{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line)}
canvas.chart{width:100%;height:210px;display:block}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.heat div{padding:9px;border-radius:9px;font-size:12px;font-weight:600;color:#fff;text-align:center}
.qrev{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--panel)}
.bar{height:8px;border-radius:6px;background:var(--blue-soft);overflow:hidden}
.bar>i{display:block;height:100%}
ul.tight{margin:.3rem 0;padding-left:1.1rem} ul.tight li{margin:.2rem 0}
/* ---- planner (clean, scannable) ---- */
.plan-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:14px}
.plan-summary div{background:var(--blue-soft);border-radius:12px;padding:10px 12px}
.plan-summary b{display:block;font-size:22px;font-weight:900;line-height:1.1}
.plan-summary span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.next-test{background:linear-gradient(135deg,var(--blue-d),var(--blue));color:#fff}
.next-test .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.next-test h3{color:#fff}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding:5px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;margin-bottom:14px}
.ptabs button{flex:1;min-width:104px;border:0;background:transparent;padding:9px 12px;border-radius:10px;
  font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:.15s}
.ptabs button.active{background:var(--blue);color:#fff}
.plan-month{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.prow{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;
  border:1px solid var(--line);border-left:4px solid var(--sub,var(--line));border-radius:12px;
  padding:12px 14px;margin:8px 0;background:var(--panel)}
.prow.done{opacity:.68}
.prow.done .prow-top b{text-decoration:line-through}
.prow-main{min-width:210px;flex:1;display:grid;gap:4px}
.prow-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prow-acts{display:flex;gap:6px;flex-wrap:wrap}
.cal .cell .dots{display:flex;gap:3px;margin-top:3px}
.cal .cell .dots i{width:5px;height:5px;border-radius:50%}
.cal-detail{margin-top:12px}
.formgrid{display:grid;gap:10px}
.formgrid label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.formgrid input,.formgrid textarea{width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;outline:0;font-weight:500;color:var(--ink)}
/* ---- question review (calm, readable) ---- */
.qrev{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:14px;
  margin-bottom:14px;background:var(--panel)}
.qrev.is-correct{border-left-color:var(--green)}
.qrev.is-wrong{border-left-color:var(--red)}
.qrev.is-skipped{border-left-color:var(--amber)}
.qrev-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;
  padding-bottom:10px;border-bottom:1px dashed var(--line);margin-bottom:10px}
.qrev-no{font-weight:900;font-size:15px}
.qrev-ans{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qrev-ans span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:9px;background:var(--blue-soft)}
.qrev-ans span.ok{background:rgba(30,158,87,.15);color:var(--green)}
.qrev-ans span.no{background:rgba(211,59,59,.13);color:var(--red)}
.qrev details{margin-top:10px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qrev details summary{cursor:pointer;padding:10px 12px;font-weight:700;font-size:13px;background:var(--blue-soft);list-style:none}
.qrev details summary::-webkit-details-marker{display:none}
.qrev details summary:before{content:"▸ ";}
.qrev details[open] summary:before{content:"▾ ";}
.qrev details .in{padding:12px}
.qrev-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.offline-bar{position:fixed;left:0;right:0;bottom:0;z-index:200;background:var(--amber);color:#1b1b1b;
  font-size:13px;font-weight:700;text-align:center;padding:8px 12px}
/* ---- premium score report (ScoreBooster style) ---- */
.sb-hero{position:relative;overflow:hidden;border-radius:20px;padding:26px;color:#fff;
  background:linear-gradient(135deg,#4c1d95,#5b21b6 45%,#6d28d9);box-shadow:0 18px 40px -22px rgba(76,29,149,.9)}
.sb-hero:after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.08)}
.sb-top{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.sb-hello{font-size:19px;opacity:.9}
.sb-title{font-size:34px;font-weight:900;margin:2px 0 12px;line-height:1.1}
.sb-tag{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);
  border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px}
.sb-ring{position:relative;width:150px;height:150px;flex:0 0 auto}
.sb-ring svg{transform:rotate(-90deg)}
.sb-ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.sb-ring .lbl span{font-size:11px;letter-spacing:.14em;opacity:.85;font-weight:800}
.sb-ring .lbl b{font-size:40px;font-weight:900;display:block}
.sb-ring .lbl i{font-style:normal;font-size:12px;opacity:.85}
.sb-oqa{margin-top:22px;position:relative;z-index:1;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
  border-radius:16px;padding:16px}
.sb-oqa h4{margin:0 0 10px;font-size:15px;letter-spacing:.02em}
.sb-oqa .r{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end}
.sb-bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.22);margin:12px 0 10px}
.sb-bar i{display:block;height:100%}
.sb-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px}
.sb-legend span{display:flex;align-items:center;gap:6px;font-weight:700}
.sb-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.sb-boost{margin-top:16px;border-radius:20px;overflow:hidden;color:#fff;
  background:linear-gradient(120deg,#f26722,#e11d48 60%,#a21caf);box-shadow:0 18px 40px -24px rgba(225,29,72,.85)}
.sb-boost .in{padding:22px}
.sb-boost .brand{display:inline-flex;align-items:center;gap:0;font-weight:900;border-radius:8px;overflow:hidden;font-size:15px}
.sb-boost .brand em{font-style:normal;background:#6d28d9;padding:4px 9px}
.sb-boost .brand b{background:#fff;color:#1b1b4b;padding:4px 9px}
.sb-boost .line{display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-size:17px;line-height:1.45}
.sb-boost .line .em{font-size:20px;opacity:.9}
.sb-actions{background:var(--panel);color:var(--text);padding:18px;display:grid;gap:12px}
.sb-action{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--panel)}
.sb-action h5{margin:0 0 4px;font-size:15px}
@media(max-width:650px){.sb-title{font-size:26px}.sb-ring{width:120px;height:120px}.sb-ring .lbl b{font-size:32px}}
.revision-list{display:grid;gap:10px;margin-top:12px}
.revision-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 92%,var(--blue-soft))}
.revision-links{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
.revision-link{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line));border-radius:9px;background:var(--panel);color:var(--blue-d);font-size:12px;font-weight:800}
.revision-link:hover{background:var(--blue-soft);transform:translateY(-1px)}
.ai-shell{padding:0;overflow:hidden;border-color:color-mix(in srgb,var(--blue) 30%,var(--line))}
.ai-hero{padding:20px;background:linear-gradient(120deg,var(--ink-nav-a),var(--ink-nav-b));color:#fff;display:flex;justify-content:space-between;gap:18px;align-items:center}
.ai-hero .muted{color:rgba(255,255,255,.72)}
.ai-score{min-width:112px;text-align:center;padding:12px;border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(255,255,255,.09)}
.ai-score b{display:block;font-size:28px;color:#fff}
.ai-body{padding:18px}
.ai-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.ai-metric{padding:14px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 90%,var(--blue-soft));position:relative;overflow:hidden}
.ai-metric:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--blue)}
.ai-metric .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.ai-metric .v{font-size:24px;font-weight:900;margin-top:4px}
.ai-panels{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ai-panel{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
.ai-panel h4{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.ai-signal{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin:9px 0;font-size:13px}
.ai-signal .bar{grid-column:1/-1;height:6px}.ai-signal .bar i{background:var(--green)}
.ai-panel.warn .ai-signal .bar i{background:var(--amber)}
.ai-recs{margin-top:12px;border-left:4px solid var(--blue);background:var(--blue-soft);padding:12px 14px;border-radius:0 10px 10px 0}
@media(max-width:650px){.revision-item{grid-template-columns:1fr}.revision-links{justify-content:flex-start}.ai-hero{align-items:flex-start}.ai-metrics,.ai-panels{grid-template-columns:1fr}.ai-score{min-width:96px}}

/* ============================================================
   PERSONALIZATION LAYER — accents, density, font size, card style
   ============================================================ */
html[data-accent="orange"]{--blue:#f26722;--blue-d:#d9531a;--blue-l:#f57c34;--blue-soft:#fff1e8}
html[data-accent="indigo"]{--blue:#4f46e5;--blue-d:#3d35c4;--blue-l:#6d66f0;--blue-soft:#eeedff}
html[data-accent="emerald"]{--blue:#0f9d68;--blue-d:#0b7d53;--blue-l:#17b87c;--blue-soft:#e6f7f0}
html[data-accent="rose"]{--blue:#e0396b;--blue-d:#bd2955;--blue-l:#ef567f;--blue-soft:#ffecf1}
html[data-accent="sky"]{--blue:#0b7ec4;--blue-d:#0a65a0;--blue-l:#1a97e0;--blue-soft:#e7f4fd}

.hero-card{background:linear-gradient(125deg,var(--ink-nav-a),var(--ink-nav-b));color:#fff;border:0;position:relative;overflow:hidden}
.hero-card:after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;background:color-mix(in srgb,var(--blue) 55%,transparent);filter:blur(70px);top:-140px;right:-90px}

<script>
/* ============================================================================
   Eklavya JEE Main CBT Platform — single file, vanilla JS.
   Sections:
     1. Utilities
      2. Storage (private progress locally + public tests in cloud storage)
     3. PDF parsing engine (fixed Vedantu HWT format)
     4. Test model / scoring
     5. Views: Dashboard, Upload, Planner, Analytics, Practice, Search, Result
     6. Exam runtime (NTA-style)
   ========================================================================== */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ------------------------------- 1. UTILS -------------------------------- */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const uid = ()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const fmtTime=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");};
const fmtDate=d=>new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
const todayKey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg,ms=2600){const t=el("div","toast",esc(msg));document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
function confirmBox(title,body,onYes,yesLabel="Yes"){
  const m=el("div","modal");
  m.innerHTML=`<div class="box"><h3>${esc(title)}</h3><p class="muted">${body}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-no>Cancel</button>
    <button class="btn" data-yes>${esc(yesLabel)}</button></div></div>`;
  m.querySelector("[data-no]").onclick=()=>m.remove();
  m.querySelector("[data-yes]").onclick=()=>{m.remove();onYes();};
  document.body.appendChild(m);
}
const SUBJECTS=["Physics","Chemistry","Mathematics"];
const SUBCOLOR={Physics:"#0b57a4",Chemistry:"#1e9e57",Mathematics:"#7a3ec8"};

/* ------------------------------ 2. STORAGE ------------------------------- */
const LS="jeecbt.v1";
const DB_NAME="jeecbt-img", DB_STORE="img";
let _db=null;
function db(){return _db||(_db=new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(DB_STORE);
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
}));}
async function imgPut(k,v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(DB_STORE,"readwrite");t.objectStore(DB_STORE).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function imgGet(k){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(DB_STORE,"readonly").objectStore(DB_STORE).get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
const imgCache=new Map();
async function imgURL(k){if(!k)return null;if(imgCache.has(k))return imgCache.get(k);const v=await imgGet(k);imgCache.set(k,v);return v;}
/** <img> that lazily resolves its IndexedDB source. */
function imgTag(key,cls="qimg"){
  const i=el("img",cls); i.alt="";
  if(key) (key.startsWith("cloud:")?cloudObjectURL(key.slice(6)):imgURL(key)).then(u=>{if(u)i.src=u;});
  return i;
}

const DEFAULT={tests:[],attempts:[],bookmarks:[],planner:[],plannerDone:{},notes:{},studyLog:{},
  settings:{theme:"system",accent:"orange",density:"comfortable",fontSize:"md",cards:"elevated",anim:"on",candidate:"Candidate"}};
let S = load();
function load(){
  try{
    const saved=Object.assign({},DEFAULT,JSON.parse(localStorage.getItem(LS)||"{}"));
    saved.tests=(saved.tests||[]).filter(t=>t.practice);
    return saved;
  }catch(e){return JSON.parse(JSON.stringify(DEFAULT));}
}
function save(){
  try{localStorage.setItem(LS,JSON.stringify({...S,tests:S.tests.filter(t=>t.practice)}));}
  catch(e){toast("Local progress storage is full.");}
}

/* Public test papers live in Lovable Cloud. Results, bookmarks, planner and
   personal progress remain in this browser and are never uploaded. */
let CLOUD=null, cloudTests=[], cloudRefresh=null;
const pendingFiles={Physics:null,Chemistry:null,Mathematics:null};
async function cloudInit(){
  if(CLOUD)return CLOUD;
  const r=await fetch("/api/public/cloud-config");
  if(!r.ok)throw new Error("Cloud storage is unavailable");
  CLOUD=await r.json();return CLOUD;
}
async function cloudFetch(path,options={}){
  const c=await cloudInit();
  const headers=new Headers(options.headers||{});
  headers.set("apikey",c.publishableKey);headers.set("Authorization","Bearer "+c.publishableKey);
  const r=await fetch(c.url+path,{...options,headers});
  if(!r.ok)throw new Error((await r.text())||("Cloud request failed ("+r.status+")"));
  return r;
}
const objectPath=p=>p.split("/").map(encodeURIComponent).join("/");
async function cloudObjectURL(path){
  if(imgCache.has("cloud:"+path))return imgCache.get("cloud:"+path);
  const key="blob:"+path;
  try{
    const r=await cloudFetch("/storage/v1/object/public-tests/"+objectPath(path));
    const blob=await r.blob();
    imgPut(key,blob).catch(()=>{});                 // keep it for offline review
    const u=URL.createObjectURL(blob);imgCache.set("cloud:"+path,u);return u;
  }catch(e){
    const cached=await imgGet(key).catch(()=>null); // no network: serve the saved copy
    if(!cached)throw e;
    const u=URL.createObjectURL(cached);imgCache.set("cloud:"+path,u);return u;
  }
}
async function uploadObject(path,body,contentType){
  await cloudFetch("/storage/v1/object/public-tests/"+objectPath(path),{
    method:"POST",headers:{"Content-Type":contentType,"x-upsert":"true"},body
  });
}
async function cloudifyTest(test,files,onProgress){
  const copy=structuredClone(test),base=test.id;
  for(const sub of SUBJECTS){
    const f=files[sub];if(!f)throw new Error(sub+" PDF is missing");
    onProgress("Uploading "+sub+" PDF…");
    await uploadObject(`${base}/source/${sub.toLowerCase()}.pdf`,f,"application/pdf");
  }
  const refs=[];
  copy.questions.forEach(q=>{
    if(q.img)refs.push([q,"img",q.img]);if(q.solImg)refs.push([q,"solImg",q.solImg]);
    (q.options||[]).forEach(o=>{if(o.img)refs.push([o,"img",o.img]);});
  });
  for(let i=0;i<refs.length;i++){
    const [owner,key,localKey]=refs[i],data=await imgGet(localKey);
    if(!data)continue;
    const blob=await (await fetch(data)).blob(),path=`${base}/assets/${String(i+1).padStart(4,"0")}.jpg`;
    onProgress(`Uploading test assets ${i+1}/${refs.length}…`);
    await uploadObject(path,blob,"image/jpeg");owner[key]="cloud:"+path;
  }
  return copy;
}
function rowToTest(row){
  const t=row.parsed_test;
  return {...t,id:row.id,name:row.title,createdAt:new Date(row.created_at).getTime(),cloud:true,
    testId:row.test_id,shareSlug:row.share_slug,
    meta:{year:row.exam_year||null,difficulty:row.difficulty||"Moderate",type:row.test_type||"Full Syllabus",
      chapters:row.chapters||[],subjectChapters:row.subject_chapters||{},attempts:row.attempts_count||0,
      durationMin:row.duration_minutes||Math.round((t.duration||10800)/60)}};
}
let OFFLINE=false;
const LIB_CACHE="cache:publicTests";
function setOffline(v){
  if(OFFLINE===v)return; OFFLINE=v;
  const bar=$("#offlineBar");
  if(bar)bar.classList.toggle("hide",!v);
}
async function hydrateFromCache(){
  try{
    const rows=await imgGet(LIB_CACHE);
    if(!rows||!rows.length)return false;
    cloudTests=rows.map(rowToTest);
    S.tests=[...S.tests.filter(t=>t.practice),...cloudTests];
    return true;
  }catch(e){return false;}
}
async function loadPublicTests(silent=false){
  try{
    const r=await cloudFetch("/rest/v1/public_tests?select=*&is_published=eq.true&order=created_at.desc");
    const rows=await r.json(),before=cloudTests.map(t=>t.id+":"+t.createdAt).join("|");
    imgPut(LIB_CACHE,rows).catch(()=>{});          // library stays browsable offline
    setOffline(false);
    cloudTests=rows.map(rowToTest);
    S.tests=[...S.tests.filter(t=>t.practice),...cloudTests];
    const changed=before!==cloudTests.map(t=>t.id+":"+t.createdAt).join("|");
    if(!silent||(changed&&(route==="dash"||route==="library")))render();
    const slug=new URLSearchParams(location.search).get("test");
    if(slug&&!window.__sharedTestOpened){const t=cloudTests.find(x=>x.shareSlug===slug);if(t){window.__sharedTestOpened=true;startExam(t.id);}}
  }catch(e){
    setOffline(true);
    const ok=await hydrateFromCache();
    if(ok)render();
    if(!silent)toast(ok?"Offline — showing the saved Test Library":"Offline and nothing saved yet");
  }
}
async function publishPublicTest(test,files,onProgress,meta={}){
  const publicTest=await cloudifyTest(test,files,onProgress);
  onProgress("Publishing test to the public library…");
  const subjectChapters=meta.subjectChapters||test.chapter||{};
  const chapters=[...new Set(Object.values(subjectChapters).join(",").split(/[,;•|]/).map(x=>x.trim()).filter(Boolean))];
  const payload={id:test.id,title:test.name,physics_pdf_path:`${test.id}/source/physics.pdf`,
    chemistry_pdf_path:`${test.id}/source/chemistry.pdf`,mathematics_pdf_path:`${test.id}/source/mathematics.pdf`,
    parsed_test:publicTest,question_count:test.questions.length,duration_minutes:Math.round(test.duration/60),
    exam_year:meta.year||new Date().getFullYear(),difficulty:meta.difficulty||"Moderate",
    test_type:meta.type||"Full Syllabus",chapters,subject_chapters:subjectChapters};
  const r=await cloudFetch("/rest/v1/public_tests",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify(payload)});
  return rowToTest((await r.json())[0]);
}
/** Public counter — increments only the attempt tally of a published test. */
async function registerAttempt(testId){
  try{
    await cloudFetch("/rest/v1/rpc/register_test_attempt",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({_test_id:testId})});
  }catch(e){/* attempt counting is best-effort and never blocks the exam */}
}

/** Only local tweaks (a shifted date, a renamed slot) and "done" ticks are per-device. */
function plannerEdits(){return S.plannerEdits||(S.plannerEdits={});}
function PLAN(){
  const e=plannerEdits();
  return BUILTIN_PLAN.map(r=>{
    const p=e[r.id]||{};
    return {...r,date:p.date||r.date,time:p.time||r.time,name:p.name||r.name,
      topics:(p.topics!=null?p.topics:(r.topics||[]).join("; ")),
      edited:!!(p.date||p.time||p.name||p.topics!=null),
      done:!!(S.plannerDone||{})[r.id]};
  });
}
function setPlannerDone(r,v){
  S.plannerDone=S.plannerDone||{};
  if(v)S.plannerDone[r.id]=true; else delete S.plannerDone[r.id];
  save();
}
/** Dates and slots do move — this lets a student correct a row on their device. */
function editPlannerRow(r,after){
  const m=el("div","modal");
  m.innerHTML=`<div class="box"><h3>Edit this test slot</h3>
    <div class="small muted" style="margin-bottom:10px">Saved on this device only — the shared planner stays intact.</div>
    <div class="formgrid">
      <label>Test name<input type="text" data-k="name" value="${esc(r.name)}"></label>
      <label>Date<input type="date" data-k="date" value="${esc(String(r.date).slice(0,10))}"></label>
      <label>Time slot<input type="text" data-k="time" value="${esc(r.time||"")}"></label>
      <label>Topics<textarea data-k="topics" rows="3">${esc(r.topics||"")}</textarea></label>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:14px;flex-wrap:wrap">
      <button class="btn sm ghost" data-reset>Reset to original</button>
      <button class="btn sm ghost" data-no>Cancel</button>
      <button class="btn sm" data-yes>Save changes</button></div></div>`;
  const val=k=>m.querySelector(`[data-k="${k}"]`).value.trim();
  m.querySelector("[data-no]").onclick=()=>m.remove();
  m.querySelector("[data-reset]").onclick=()=>{delete plannerEdits()[r.id];save();m.remove();toast("Slot restored");after&&after();};
  m.querySelector("[data-yes]").onclick=()=>{
    const base=BUILTIN_PLAN.find(x=>x.id===r.id)||{},patch={};
    const d=val("date"); if(d&&d!==String(base.date).slice(0,10))patch.date=d+"T00:00:00";
    if(val("time")&&val("time")!==base.time)patch.time=val("time");
    if(val("name")&&val("name")!==base.name)patch.name=val("name");
    if(val("topics")!==(base.topics||[]).join("; "))patch.topics=val("topics");
    if(Object.keys(patch).length)plannerEdits()[r.id]=patch; else delete plannerEdits()[r.id];
    save();m.remove();toast("Schedule updated on this device");after&&after();
  };
  document.body.appendChild(m);
}
function shareTest(t){
  const url=location.origin+location.pathname+"?test="+encodeURIComponent(t.shareSlug);
  navigator.clipboard.writeText(url).then(()=>toast("Public test link copied"),()=>prompt("Copy this public test link",url));
}

/* --------------------------- 3. PDF PARSING ------------------------------ */
/* The Vedantu HWT papers have a fixed structure:
   [2-column question pages] -> "Answer Key" grid -> "Solutions" (single column).
   Strategy: locate question numbers via text coordinates, then CROP the rendered
   page bitmap for each question / option / solution. Cropping preserves
   equations, tables and figures exactly as printed.                          */

const RENDER_SCALE=2.0;

function trimCanvas(cv){                     // remove surrounding white space
  const ctx=cv.getContext("2d"),w=cv.width,h=cv.height;
  if(!w||!h) return cv;
  const d=ctx.getImageData(0,0,w,h).data;
  let top=h,left=w,right=0,bottom=0,found=false;
  for(let y=0;y<h;y++){for(let x=0;x<w;x++){const i=(y*w+x)*4;
    if(d[i]<245||d[i+1]<245||d[i+2]<245){found=true;
      if(y<top)top=y; if(y>bottom)bottom=y; if(x<left)left=x; if(x>right)right=x;}}}
  if(!found) return null;
  const pad=6;
  left=clamp(left-pad,0,w); top=clamp(top-pad,0,h);
  right=clamp(right+pad,0,w); bottom=clamp(bottom+pad,0,h);
  const out=document.createElement("canvas");
  out.width=right-left; out.height=bottom-top;
  out.getContext("2d").drawImage(cv,left,top,out.width,out.height,0,0,out.width,out.height);
  return out;
}
async function cropStore(pageCanvas,x0,y0,x1,y1){
  const w=Math.max(1,Math.round((x1-x0)*RENDER_SCALE)),h=Math.max(1,Math.round((y1-y0)*RENDER_SCALE));
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const c=cv.getContext("2d"); c.fillStyle="#fff"; c.fillRect(0,0,w,h);
  c.drawImage(pageCanvas,x0*RENDER_SCALE,y0*RENDER_SCALE,w,h,0,0,w,h);
  const t=trimCanvas(cv); if(!t) return null;
  const key="img:"+uid();
  await imgPut(key,t.toDataURL("image/jpeg",0.78));
  return key;
}
/** Extract text items with top-left coordinates in PDF points. */
async function pageItems(page){
  const vp=page.getViewport({scale:1}); const tc=await page.getTextContent();
  return {W:vp.width,H:vp.height,items:tc.items.filter(i=>i.str.trim()).map(i=>({
    s:i.str.trim(), x:i.transform[4], y:vp.height-i.transform[5], h:Math.abs(i.transform[3])||10
  }))};
}
async function renderPage(page){
  const vp=page.getViewport({scale:RENDER_SCALE});
  const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height;
  const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  return cv;
}
/** Text inside a rectangle (used for search + AI topic hints). */
function textIn(items,x0,y0,x1,y1){
  return items.filter(i=>i.x>=x0-2&&i.x<=x1&&i.y>=y0-2&&i.y<=y1)
    .sort((a,b)=>a.y-b.y||a.x-b.x).map(i=>i.s).join(" ").replace(/\s+/g," ").trim();
}

async function parsePaper(file,subject,onProgress){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const pg=await pdf.getPage(p);
    const meta=await pageItems(pg);
    pages.push({n:p,pg,...meta,canvas:null});
    onProgress&&onProgress(`Reading page ${p}/${pdf.numPages}`);
  }
  const canvasOf=async pi=>pi.canvas||(pi.canvas=await renderPage(pi.pg));

  // ---- locate section markers ----
  let akPos=null, solPos=null;
  pages.forEach(p=>p.items.forEach(i=>{
    if(!akPos && /^answer\s*key$/i.test(i.s)) akPos={p:p.n,y:i.y};
    if(!solPos && /^solutions?$/i.test(i.s)) solPos={p:p.n,y:i.y};
  }));
  akPos=akPos||{p:pages.length,y:0}; solPos=solPos||{p:pages.length,y:0};
  const before=(a,b)=>a.p<b.p||(a.p===b.p&&a.y<b.y);

  // ---- collect sequential question-number markers in the question section --
  const numRe=/^(\d{1,2})[.)]$/;
  const qMarks=[]; let expect=1;
  for(const p of pages){
    if(p.n>akPos.p) break;
    const W=p.W;
    const cands=p.items.filter(i=>numRe.test(i.s)&&(i.x<W*0.12||(i.x>W*0.48&&i.x<W*0.62)))
      .map(i=>({...i,col:i.x<W*0.5?0:1,page:p}))
      .sort((a,b)=>a.col-b.col||a.y-b.y);
    for(const c of cands){
      if(p.n===akPos.p && c.y>=akPos.y-4) continue;
      if(+c.s.replace(/\D/g,"")===expect){qMarks.push(c);expect++;}
    }
  }
  // ---- build question objects ----
  const questions=[];
  for(let k=0;k<qMarks.length;k++){
    const m=qMarks[k], p=m.page, W=p.W, H=p.H;
    const x0=m.col?W*0.505:W*0.02, x1=m.col?W*0.99:W*0.495;
    const nxt=qMarks[k+1];
    let yEnd;
    if(nxt&&nxt.page.n===p.n&&nxt.col===m.col) yEnd=nxt.y-(nxt.h||10)-4;
    else if(p.n===akPos.p) yEnd=akPos.y-6;
    else yEnd=H-28;
    const yTop=m.y-m.h-4;
    const cv=await canvasOf(p);
    // options
    const optRe=/^\(?([a-d])\)$/i;
    const opts=p.items.filter(i=>optRe.test(i.s)&&i.x>=x0&&i.x<=x0+W*0.10&&i.y>yTop&&i.y<yEnd)
      .sort((a,b)=>a.y-b.y);
    const stemEnd=opts.length?opts[0].y-opts[0].h-2:yEnd;
    const q={
      id:uid(), subject, no:k+1, type:opts.length>=4?"mcq":"integer",
      text:textIn(p.items,x0,yTop,x1,stemEnd),
      img:await cropStore(cv,x0,yTop,x1,stemEnd), options:[]
    };
    for(let o=0;o<opts.length;o++){
      const oy=opts[o].y-opts[o].h-2;
      const oe=o+1<opts.length?opts[o+1].y-opts[o+1].h-2:yEnd;
      const ox=opts[o].x+13;   // skip the printed "(a)" label — the UI draws its own
      q.options.push({
        label:opts[o].s.replace(/[()]/g,"").toLowerCase(),
        text:textIn(p.items,ox,oy,x1,oe),
        img:await cropStore(cv,ox,oy,x1,oe)
      });
    }
    questions.push(q);
    onProgress&&onProgress(`${subject}: question ${k+1}/${qMarks.length}`);
  }

  // ---- answer key grid: pairs of (index row, answer row) ----
  const keyItems=[];
  pages.forEach(p=>{
    if(p.n<akPos.p||p.n>solPos.p) return;
    p.items.forEach(i=>{
      const after = p.n>akPos.p || i.y>akPos.y+2;
      const beforeSol = p.n<solPos.p || i.y<solPos.y-2;
      if(after&&beforeSol) keyItems.push({...i,page:p.n});
    });
  });
  const rows=[];
  keyItems.sort((a,b)=>a.page-b.page||a.y-b.y||a.x-b.x).forEach(i=>{
    const last=rows[rows.length-1];
    if(last&&last.page===i.page&&Math.abs(last.y-i.y)<6){last.cells.push(i);last.y=(last.y+i.y)/2;}
    else rows.push({page:i.page,y:i.y,cells:[i]});
  });
  const answers={}; let pending=null;
  for(const r of rows){
    const cells=r.cells.sort((a,b)=>a.x-b.x).map(c=>c.s);
    const allIdx=cells.length>1&&cells.every(c=>/^\d{1,2}$/.test(c))&&
      cells.every((c,i2)=>i2===0||+c===+cells[i2-1]+1);
    if(allIdx&&(!pending)){pending=cells.map(Number);continue;}
    if(pending&&cells.length===pending.length){
      pending.forEach((n,i2)=>answers[n]=cells[i2]);
      pending=null;
    } else if(allIdx){pending=cells.map(Number);}
  }
  // The answer key is the source of truth for question type:
  // a letter => single-correct MCQ, a number => numerical (integer) question.
  questions.forEach(q=>{
    const raw=(answers[q.no]||"").trim();
    const isLetter=/^[a-dA-D]$/.test(raw);
    if(isLetter && q.options.length>=2){q.type="mcq";q.answer=raw.toLowerCase();}
    else if(isLetter){q.type="mcq";q.answer=raw.toLowerCase();}
    else {q.type="integer";q.options=[];q.answer=raw.replace(/[^0-9.\-]/g,"");}
  });

  // ---- solutions (single column) ----
  const solMarks=[]; expect=1;
  for(const p of pages){
    if(p.n<solPos.p) continue;
    const cands=p.items.filter(i=>numRe.test(i.s)&&i.x<p.W*0.10&&(p.n>solPos.p||i.y>solPos.y))
      .sort((a,b)=>a.y-b.y);
    for(const c of cands) if(+c.s.replace(/\D/g,"")===expect){solMarks.push({...c,page:p});expect++;}
  }
  for(let k=0;k<solMarks.length;k++){
    const m=solMarks[k],p=m.page,q=questions[k]; if(!q) break;
    const nxt=solMarks[k+1];
    const yEnd=(nxt&&nxt.page.n===p.n)?nxt.y-(nxt.h||10)-4:p.H-26;
    const cv=await canvasOf(p);
    q.solText=textIn(p.items,p.W*0.02,m.y-m.h-3,p.W*0.99,yEnd);
    q.solImg=await cropStore(cv,p.W*0.02,m.y-m.h-3,p.W*0.99,yEnd);
    onProgress&&onProgress(`${subject}: solution ${k+1}/${solMarks.length}`);
  }
  pages.forEach(p=>p.canvas=null);
  return questions;
}

/* --------------------------- 4. TEST / SCORING --------------------------- */
const MARK_C=4, MARK_W=-1, TEST_MINUTES=180;
function buildTest(name,packs){
  const questions=[];
  SUBJECTS.forEach(sub=>(packs[sub]||[]).forEach(q=>questions.push(q)));
  questions.forEach((q,i)=>q.index=i);
  return {id:uid(),name,createdAt:Date.now(),date:new Date().toISOString(),
          duration:TEST_MINUTES*60,questions,chapter:{}};
}
function testById(id){return S.tests.find(t=>t.id===id);}
function attemptsOf(id){return S.attempts.filter(a=>a.testId===id);}
function isRight(q,ans){
  if(ans==null||ans==="")return false;
  if(q.type==="mcq")return String(ans).toLowerCase()===String(q.answer||"").toLowerCase();
  const a=parseFloat(ans),b=parseFloat(q.answer);
  return isFinite(a)&&isFinite(b)&&Math.abs(a-b)<0.01;
}
function evaluate(test,resp){
  const per={},all={correct:0,wrong:0,skipped:0,marks:0,neg:0,time:0,total:test.questions.length};
  SUBJECTS.forEach(s=>per[s]={correct:0,wrong:0,skipped:0,marks:0,total:0,time:0});
  test.questions.forEach(q=>{
    const r=resp[q.id]||{}; const p=per[q.subject]; p.total++;
    const t=r.time||0; p.time+=t; all.time+=t;
    if(r.ans==null||r.ans===""){p.skipped++;all.skipped++;}
    else if(isRight(q,r.ans)){p.correct++;all.correct++;p.marks+=MARK_C;all.marks+=MARK_C;}
    else {p.wrong++;all.wrong++;p.marks+=MARK_W;all.marks+=MARK_W;all.neg+=Math.abs(MARK_W);}
  });
  const attempted=all.correct+all.wrong;
  all.accuracy=pct(all.correct,attempted);
  all.percentage=pct(all.marks,all.total*MARK_C);
  all.max=all.total*MARK_C;
  return {per,all};
}

/* --------------------------- 5. AI ANALYSIS ------------------------------ */
/* Deterministic, on-device analysis engine (no network). */
function analyse(test,attempt){
  const r=attempt.result, resp=attempt.responses, qs=test.questions;
  const times=qs.map(q=>(resp[q.id]||{}).time||0);
  const avgT=times.reduce((a,b)=>a+b,0)/(qs.length||1);
  const rows=qs.map(q=>{
    const x=resp[q.id]||{};
    const status=(x.ans==null||x.ans==="")?"skipped":(isRight(q,x.ans)?"correct":"wrong");
    return {q,ans:x.ans,time:x.time||0,status,chapter:q.chapter||test.chapter[q.subject]||q.subject+" — General",
      guess:(x.changes||0)>2||((x.time||0)<20&&status!=="skipped")};
  });
  const bySub={};SUBJECTS.forEach(s=>bySub[s]=r.per[s]);
  const strongSub=SUBJECTS.slice().sort((a,b)=>bySub[b].marks-bySub[a].marks);
  const chMap={};
  rows.forEach(x=>{const c=chMap[x.chapter]=chMap[x.chapter]||{c:0,w:0,s:0,t:0,n:0};
    c.n++;c.t+=x.time;c[x.status==="correct"?"c":x.status==="wrong"?"w":"s"]++;});
  const chapters=Object.entries(chMap).map(([k,v])=>({name:k,...v,acc:pct(v.c,v.n)}));
  const slow=rows.slice().sort((a,b)=>b.time-a.time).slice(0,5);
  const easyMissed=rows.filter(x=>x.status!=="correct"&&x.time<avgT*0.6);
  const hardSolved=rows.filter(x=>x.status==="correct"&&x.time>avgT*1.6);
  const careless=rows.filter(x=>x.status==="wrong"&&x.time<avgT*0.5);
  const calc=rows.filter(x=>x.status==="wrong"&&x.time>avgT*1.3);
  const conceptual=rows.filter(x=>x.status==="wrong"&&x.time>=avgT*0.5&&x.time<=avgT*1.3);
  const guesses=rows.filter(x=>x.guess&&x.status!=="skipped");
  const guessAcc=pct(guesses.filter(g=>g.status==="correct").length,guesses.length);
  // expected JEE metrics (300-mark scale)
  const score300=Math.round(r.all.percentage/100*300);
  const percentile=+(clamp(100*(1-Math.exp(-Math.pow(score300/300,1.6)*3.6)),0.5,99.99)).toFixed(3);
  const rank=Math.max(1,Math.round((100-percentile)/100*1200000));
  const trend=S.attempts.filter(a=>a.submittedAt).sort((a,b)=>a.submittedAt-b.submittedAt).map(a=>a.result.all.percentage);
  const improving=trend.length>1?trend[trend.length-1]-trend[0]:0;
  const weakCh=chapters.slice().sort((a,b)=>a.acc-b.acc).slice(0,5);
  const strongCh=chapters.slice().sort((a,b)=>b.acc-a.acc).slice(0,5);
  const recs=[];
  if(r.all.accuracy<60)recs.push("Accuracy below 60% — attempt fewer questions but verify each step before locking the answer.");
  if(careless.length>2)recs.push(`${careless.length} careless errors detected (fast wrong answers). Re-read the question stem once before answering.`);
  if(calc.length>2)recs.push(`${calc.length} likely calculation errors. Practise timed numerical drills without a calculator.`);
  if(r.all.skipped>15)recs.push(`${r.all.skipped} questions left unattempted — improve speed with sectional timing (36 min per subject block).`);
  if(guesses.length>5&&guessAcc<35)recs.push("Guess accuracy is poor; avoid negative marking by skipping when unsure between more than 2 options.");
  strongSub.slice(-1).forEach(s=>recs.push(`${s} is your lowest scoring subject — allocate 40% of daily revision to it this week.`));
  weakCh.slice(0,3).forEach(c=>recs.push(`Revise "${c.name}" — accuracy only ${c.acc}%.`));
  if(!recs.length)recs.push("Excellent balanced performance — maintain the current routine and increase difficulty.");
  return {rows,avgT,chapters,weakCh,strongCh,slow,easyMissed,hardSolved,careless,calc,conceptual,
    guesses,guessAcc,score300,percentile,rank,improving,strongSub,recs};
}

function globalStats(){
  const done=S.attempts.filter(a=>a.submittedAt);
  const marks=done.map(a=>a.result.all.marks);
  const acc=done.map(a=>a.result.all.accuracy);
  const subAgg={};SUBJECTS.forEach(s=>subAgg[s]={c:0,n:0});
  done.forEach(a=>SUBJECTS.forEach(s=>{const p=a.result.per[s];if(p){subAgg[s].c+=p.correct;subAgg[s].n+=p.total;}}));
  const ranked=SUBJECTS.map(s=>({s,acc:pct(subAgg[s].c,subAgg[s].n),n:subAgg[s].n})).filter(x=>x.n).sort((a,b)=>b.acc-a.acc);
  return {done,total:done.length,avg:marks.length?Math.round(marks.reduce((x,y)=>x+y,0)/marks.length):0,
    high:marks.length?Math.max(...marks):0,avgAcc:acc.length?Math.round(acc.reduce((x,y)=>x+y,0)/acc.length*10)/10:0,
    strong:ranked[0],weak:ranked[ranked.length-1],ranked};
}

const pending={Physics:null,Chemistry:null,Mathematics:null};
function viewUpload(root){
  const c=el("div","card");
  c.innerHTML=`<h2>Upload Question Papers</h2>
   <p class="muted small">Upload one PDF per subject in the standard HWT format. Questions, options, answer key

  const grid=el("div","grid g3");
  SUBJECTS.forEach(sub=>{
    const d=el("div","drop");
    d.innerHTML=`<div style="font-size:30px">${sub==="Physics"?"⚛️":sub==="Chemistry"?"🧪":"📐"}</div>
      <h4>${sub}</h4><div class="small muted" data-st>No file selected</div>`;
    const inp=el("input");inp.type="file";inp.accept="application/pdf";inp.className="hide";
    const b=el("button","btn sm","Choose PDF");b.onclick=()=>inp.click();
    inp.onchange=async()=>{
      const f=inp.files[0]; if(!f)return;

    w.appendChild(el("label","small muted",label));node.style.width="100%";w.appendChild(node);return w;};
  mgrid.append(field("Test name",name),field("Year",year),field("Difficulty",diff),field("Test type",type));
  SUBJECTS.forEach(s=>{const i=el("input");i.type="text";i.placeholder="e.g. Rotation, Thermodynamics";chapIn[s]=i;
    mgrid.appendChild(field(s+" chapters",i));});

  foot.appendChild(mk);c.appendChild(foot);
  const status=el("div","small muted");status.style.marginTop="8px";c.appendChild(status);

  }

    w.appendChild(el("label","small muted",label));node.style.width="100%";w.appendChild(node);return w;};
  fsGrid.append(fsField("Test name",fsName),fsField("Year",fsYear),fsField("Difficulty",fsDiff));
  fs.appendChild(fsGrid);
  const fsSt=el("div","small muted");fsSt.style.marginTop="10px";fsSt.textContent="No file selected.";
  const fsIn=el("input");fsIn.type="file";fsIn.accept="application/pdf";fsIn.className="hide";
  const fsBtn=el("button","btn","Upload & Publish Full Syllabus PDF");
  fsBtn.onclick=()=>fsIn.click();
  fsIn.onchange=async()=>{
    const f=fsIn.files[0];if(!f)return;
    fsBtn.disabled=true;
    try{
      const qs=await parsePaper(f,"Physics",m=>fsSt.textContent=m);
      if(!qs.length)throw new Error("No questions detected");
      const per=Math.ceil(qs.length/3),packs={Physics:[],Chemistry:[],Mathematics:[]};
      qs.forEach((q,i)=>{const sub=SUBJECTS[Math.min(2,Math.floor(i/per))];q.subject=sub;packs[sub].push(q);});
      const t=buildTest(fsName.value.trim()||"Full Syllabus Mock Test",packs);
      t.id=crypto.randomUUID();t.duration=180*60;
      SUBJECTS.forEach(sub=>{t.chapter[sub]="Full Syllabus";});
      t.questions.forEach(q=>q.chapter=q.chapter||"Full Syllabus — "+q.subject);
      const meta={year:+fsYear.value||new Date().getFullYear(),difficulty:fsDiff.value,
        type:"Full Syllabus",subjectChapters:t.chapter};
      const published=await publishPublicTest(t,{Physics:f,Chemistry:f,Mathematics:f},m=>fsSt.textContent=m,meta);
      cloudTests.unshift(published);S.tests.push(published);
      toast("Full syllabus mock published · "+published.testId);go("library");
    }catch(e){fsSt.textContent="Failed: "+e.message;toast("Publish failed: "+e.message,4500);}

  });

  if(plannerTab==="schedule"){
    if(today.length){
      const t=el("div","card");t.innerHTML=`<h3>Today's tests</h3>`;
      today.forEach(r=>t.appendChild(plannerRow(r)));root.appendChild(t);
    }
    const up=el("div","card");
    up.innerHTML=`<h3>Upcoming schedule</h3><div class="small muted">Tap Edit if a date or slot moves — the change stays on this device.</div>`;
    const shown=upcoming.slice(0,20);
    if(!shown.length)up.innerHTML+=`<div class="empty"><div class="big">🎉</div>Series complete — every scheduled test is behind you.</div>`;
    let lastMonth="";
    shown.forEach(r=>{
      const m=new Date(r.date).toLocaleDateString("en-IN",{month:"long",year:"numeric"});
      if(m!==lastMonth){lastMonth=m;up.appendChild(el("div","plan-month",esc(m)));}
      up.appendChild(plannerRow(r));
    });
    if(upcoming.length>shown.length)up.appendChild(el("div","small muted",`+ ${upcoming.length-shown.length} more later in the series`));
    root.appendChild(up);
  }

  if(plannerTab==="calendar"){
    const cal=el("div","card");cal.innerHTML=`<h3>Month view</h3>`;
    const months=[...new Set(rows.map(r=>todayKey(r.date).slice(0,7)))];
    const sel=el("select");months.forEach(m=>{const o=el("option",null,new Date(m+"-01T00:00:00").toLocaleDateString("en-IN",{month:"long",year:"numeric"}));o.value=m;sel.appendChild(o);});
    const cur=tkey.slice(0,7);sel.value=months.includes(cur)?cur:months[0];
    const grid=el("div","cal");grid.style.marginTop="10px";
    const detail=el("div","cal-detail");

      grid.innerHTML="";detail.innerHTML=`<div class="small muted">Pick a highlighted date to see its tests.</div>`;
      ["S","M","T","W","T","F","S"].forEach(d=>{const c=el("div","small muted",d);c.style.textAlign="center";grid.appendChild(c);});
      const [y,m]=sel.value.split("-").map(Number);
      const first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();
      for(let i=0;i<first;i++)grid.appendChild(el("div"));
      for(let d=1;d<=days;d++){
        const key=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

  }

    root.appendChild(dn);
  }
}

/* Personal study calendar: revision reminders synced to every scheduled and
   uploaded test's chapters. Reminders are derived, so they always stay fresh. */
function studyReminders(rows){
  const now=Date.now(),DAY=864e5,out=[];
  const push=(date,title,detail,tag)=>out.push({date,title,detail,tag});
  rows.filter(r=>!r.done&&new Date(r.date).getTime()>=now-DAY).slice(0,10).forEach(r=>{
    const d=new Date(r.date).getTime(),topics=r.topics||r.subject;
    push(d-3*DAY,"Start revision · "+r.name,`Cover ${topics} — theory + one-shot video.`,r.subject);
    push(d-DAY,"Final revision · "+r.name,`Formulas and PYQs for ${topics}.`,r.subject);
    push(d,"Test day · "+r.name,`${r.time||"Scheduled"} · ${topics}`,r.subject);
  });
  cloudTests.filter(t=>!attemptsOf(t.id).some(x=>x.submittedAt)).slice(0,6).forEach(t=>{
    const chaps=(t.meta&&t.meta.chapters||[]).slice(0,4).join(", ")||"Full syllabus";
    push(now+DAY,"Attempt · "+t.name,`${t.questions.length} questions · ${chaps}`,t.meta?.type||"Mock");
  });
  return out.filter(x=>x.date>=now-DAY).sort((a,b)=>a.date-b.date).slice(0,12);
}
function studyCalendarCard(rows){
  const c=el("div","card");
  const items=studyReminders(rows);
  c.innerHTML=`<div class="section-title"><span class="ico">🗓</span><h3 style="margin:0">Study Calendar &amp; Reminders</h3></div>
    <div class="small muted">Auto-synced with every scheduled test's chapters and any unattempted paper in the library.</div>`;
  if(!items.length){c.innerHTML+=`<div class="empty"><div class="big">📅</div>No reminders yet — publish a planner or a test to fill your calendar.</div>`;return c;}
  const list=el("div","revision-list");
  items.forEach(it=>{
    const days=Math.round((it.date-Date.now())/864e5);
    const when=days<=0?"Today":days===1?"Tomorrow":`in ${days} days`;
    const row=el("div","revision-item");
    row.innerHTML=`<div><b>${esc(it.title)}</b><div class="small muted">${fmtDate(it.date)} · ${when}</div>
      <div class="small" style="margin-top:4px">${esc(it.detail)}</div></div>`;

  c.appendChild(list);return c;
}
function revisionTopics(r){

/* ------------------------------ ANALYTICS -------------------------------- */
function lineChart(cv,data,labels,title,color="#0b57a4"){
  const dpr=devicePixelRatio||1,w=cv.clientWidth,h=210;
  cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext("2d");c.scale(dpr,dpr);
  c.clearRect(0,0,w,h);
  const pad={l:36,r:12,t:18,b:26};
  const max=Math.max(1,...data),min=Math.min(0,...data);
  const X=i=>pad.l+(w-pad.l-pad.r)*(data.length<2?0.5:i/(data.length-1));
  const Y=v=>h-pad.b-(h-pad.t-pad.b)*((v-min)/((max-min)||1));
  c.strokeStyle=getComputedStyle(document.body).getPropertyValue("--line");c.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pad.t+(h-pad.t-pad.b)*i/4;c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();
    c.fillStyle=getComputedStyle(document.body).getPropertyValue("--muted");c.font="10px sans-serif";
    c.fillText(Math.round(max-(max-min)*i/4),4,y+3);}
  c.strokeStyle=color;c.lineWidth=2.5;c.beginPath();
  data.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)));c.stroke();
  c.fillStyle=color+"22";c.lineTo(X(data.length-1),h-pad.b);c.lineTo(X(0),h-pad.b);c.closePath();c.fill();
  data.forEach((v,i)=>{c.fillStyle=color;c.beginPath();c.arc(X(i),Y(v),3.5,0,7);c.fill();});
  c.fillStyle=getComputedStyle(document.body).getPropertyValue("--muted");c.font="11px sans-serif";
  c.fillText(title,pad.l,12);
}
function donutChart(cv,slices,centerText){
  const c=cv.getContext("2d"),w=cv.width,h=cv.height,R=Math.min(w,h)/2-6,cx=w/2,cy=h/2;
  c.clearRect(0,0,w,h);
  const total=slices.reduce((s,[v])=>s+v,0)||1;
  let a0=-Math.PI/2;
  slices.forEach(([v,col])=>{
    const a1=a0+(v/total)*Math.PI*2;
    c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,R,a0,a1);c.closePath();c.fillStyle=col;c.fill();a0=a1;
  });
  c.globalCompositeOperation="destination-out";
  c.beginPath();c.arc(cx,cy,R*0.62,0,Math.PI*2);c.fill();
  c.globalCompositeOperation="source-over";
  c.fillStyle=getComputedStyle(document.body).getPropertyValue("--ink")||"#000";
  c.font="bold 46px sans-serif";c.textAlign="center";c.fillText(centerText,cx,cy+16);c.textAlign="left";
}
function barChart(cv,vals,labels,colors){
  const dpr=devicePixelRatio||1,w=cv.clientWidth,h=210;
  cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext("2d");c.scale(dpr,dpr);c.clearRect(0,0,w,h);
  const pad={l:34,r:10,t:12,b:28},max=Math.max(1,...vals);
  const bw=(w-pad.l-pad.r)/vals.length;
  vals.forEach((v,i)=>{
    const bh=(h-pad.t-pad.b)*(v/max);
    c.fillStyle=(colors&&colors[i])||"#0b57a4";
    const x=pad.l+i*bw+bw*0.18,y=h-pad.b-bh;

/* ------------------------------- PRACTICE -------------------------------- */
function collectQuestions(kind){
  const out=[];const seen=new Set();
  const push=(t,q)=>{if(!seen.has(q.id)){seen.add(q.id);out.push({t,q});}};
  const done=S.attempts.filter(a=>a.submittedAt);
  if(kind==="bookmarked"){
    S.tests.forEach(t=>t.questions.forEach(q=>{if(S.bookmarks.includes(q.id))push(t,q);}));
  } else if(kind==="weak"){
    const acc={};done.forEach(a=>{const t=testById(a.testId);if(!t)return;t.questions.forEach(q=>{
      const c=q.chapter||q.subject;const o=acc[c]=acc[c]||{c:0,n:0};o.n++;if(isRight(q,(a.responses[q.id]||{}).ans))o.c++;});});
    const weak=Object.entries(acc).filter(([,v])=>pct(v.c,v.n)<60).map(([k])=>k);
    S.tests.forEach(t=>t.questions.forEach(q=>{if(weak.includes(q.chapter||q.subject))push(t,q);}));
  } else if(kind==="mixed"){
    S.tests.forEach(t=>t.questions.forEach(q=>push(t,q)));
    out.sort(()=>Math.random()-0.5); return out.slice(0,25);
  } else {
    done.forEach(a=>{const t=testById(a.testId);if(!t)return;t.questions.forEach(q=>{
      const r=a.responses[q.id]||{};
      const skipped=r.ans==null||r.ans==="";
      if(kind==="wrong"&&!skipped&&!isRight(q,r.ans))push(t,q);
      if(kind==="skipped"&&skipped)push(t,q);});});
  }
  return out;
}

      <td><b style="color:${c.acc<50?"var(--red)":c.acc<75?"var(--amber)":"var(--green)"}">${c.acc}%</b></td><td>${fmtTime(c.t)}</td></tr>`;});
  vis.appendChild(chTb);
  root.appendChild(vis);

  // ---- comparison with the previous attempt ----
  const doneAll=S.attempts.filter(x=>x.submittedAt).sort((x,y)=>x.submittedAt-y.submittedAt);
  const idx=doneAll.findIndex(x=>x.id===a.id), prev=idx>0?doneAll[idx-1]:null;
  if(prev){
    const delta=(cur,old,suffix="")=>{const d=Math.round((cur-old)*10)/10;
      return `<b style="color:${d>=0?"var(--green)":"var(--red)"}">${d>=0?"+":""}${d}${suffix}</b>`;};
    root.appendChild(el("div","card",`<div class="section-title"><span class="ico">⚖</span><h3 style="margin:0">Compared to your previous test</h3></div>
      <div class="small muted">${esc((testById(prev.testId)||{}).name||"Previous test")} · ${fmtDate(prev.submittedAt)}</div>
      <div class="grid g4" style="margin-top:12px">
        <div class="stat"><div class="v">${delta(r.all.marks,prev.result.all.marks)}</div><div class="k">Marks</div></div>
        <div class="stat"><div class="v">${delta(r.all.accuracy,prev.result.all.accuracy,"%")}</div><div class="k">Accuracy</div></div>
        <div class="stat"><div class="v">${delta(r.all.correct,prev.result.all.correct)}</div><div class="k">Correct</div></div>
        <div class="stat"><div class="v">${delta(prev.result.all.skipped,r.all.skipped)}</div><div class="k">Fewer Skipped</div></div>
      </div>`));
  }

  // ---- revision videos for this attempt's weak chapters ----
  const recVids=ai.weakCh.slice(0,6).map(c=>{
    const row=ai.rows.find(x=>x.chapter===c.name);
    return {topic:c.name.replace(/\s*—.*$/,""),subject:(row&&row.q.subject)||"Physics",
      reason:`${c.acc}% accuracy in this test · ${c.w} wrong, ${c.s} skipped`};
  });
  root.appendChild(videoCard("Revision videos for this test","One-shot and short revision links for the chapters that cost you marks.",recVids));

  // question review
  const rc=el("div","card");
  rc.innerHTML=`<h3>Question Review</h3>`;
  const filt=el("div","row");
  ["all","correct","wrong","skipped","bookmarked"].forEach(f=>{
    const b=el("button","btn sm "+(f==="all"?"":"ghost"),f[0].toUpperCase()+f.slice(1));
    b.onclick=()=>{[...filt.children].forEach(x=>x.className="btn sm ghost");b.className="btn sm";draw(f);};
    filt.appendChild(b);
  });
  rc.appendChild(filt);
  const list=el("div");list.style.marginTop="12px";rc.appendChild(list);
  function draw(f){
    list.innerHTML="";
    ai.rows.forEach(x=>{
      if(f==="bookmarked"&&!S.bookmarks.includes(x.q.id))return;
      if(f!=="all"&&f!=="bookmarked"&&x.status!==f)return;
      const d=el("div","qrev is-"+x.status);
      const badge=x.status==="correct"?`<span class="badge g">Correct +4</span>`:
        x.status==="wrong"?`<span class="badge r">Wrong −1</span>`:`<span class="badge a">Not attempted</span>`;
      d.innerHTML=`<div class="qrev-head">
        <div class="prow-top"><span class="qrev-no">Q${x.q.no}</span>
          <span class="chip" style="color:${SUBCOLOR[x.q.subject]}">${esc(x.q.subject)}</span>${badge}</div>
        <div class="small muted">⏱ ${fmtTime(x.time)}</div></div>`;
      d.appendChild(imgTag(x.q.img));
      const opts=el("div");
      (x.q.options||[]).forEach(o=>{
        const isAns=String(o.label)===String(x.ans), isCor=String(o.label)===String(x.q.answer);
        const row=el("div","optrow"+(isCor?" correct":isAns?" wrong":""));
        row.appendChild(el("div","optlab",o.label.toUpperCase()));
        const w=el("div");w.style.flex="1";w.appendChild(imgTag(o.img));row.appendChild(w);
        if(isCor||isAns)row.appendChild(el("span","chip",isCor?"Correct answer":"Your answer"));
        opts.appendChild(row);
      });
      const optWrap=el("details");
      optWrap.innerHTML=`<summary>Options (${(x.q.options||[]).length})</summary>`;
      const inW=el("div","in");inW.appendChild(opts);optWrap.appendChild(inW);
      if(x.status!=="correct")optWrap.open=true;
      d.appendChild(optWrap);
      d.appendChild(el("div","qrev-ans",
        `<span class="${x.status==="correct"?"ok":x.ans?"no":""}">Your answer: ${x.ans?esc(String(x.ans).toUpperCase()):"—"}</span>
         <span class="ok">Correct: ${esc(String(x.q.answer||"").toUpperCase())}</span>
         <span>Time: ${fmtTime(x.time)}</span>`));
      const sol=el("details");
      sol.innerHTML=`<summary>Step-by-step solution</summary>`;
      const si=el("div","in");sol.appendChild(si);
      let loaded=false;
      sol.addEventListener("toggle",()=>{if(sol.open&&!loaded){loaded=true;si.appendChild(imgTag(x.q.solImg));}});
      d.appendChild(sol);
      const foot=el("div","qrev-foot");
      const bm=el("button","btn sm ghost",S.bookmarks.includes(x.q.id)?"★ Bookmarked":"☆ Bookmark");
      bm.onclick=()=>{const i=S.bookmarks.indexOf(x.q.id);i<0?S.bookmarks.push(x.q.id):S.bookmarks.splice(i,1);
        save();bm.textContent=S.bookmarks.includes(x.q.id)?"★ Bookmarked":"☆ Bookmark";};
      foot.appendChild(bm);
      d.appendChild(foot);
      list.appendChild(d);
    });
    if(!list.children.length)list.innerHTML=`<p class="muted">Nothing here.</p>`;
  }
  draw("all");
  root.appendChild(rc);
}

/* --------------------------- 6. EXAM RUNTIME ----------------------------- */
let EX=null; // {test, attempt, cur, timerId, tick}
const RESUME_KEY="jeecbt.resume";
/** Snapshot the live attempt so a crash, refresh or closed tab loses nothing. */
function examAutosave(){
  if(!EX)return;
  try{localStorage.setItem(RESUME_KEY,JSON.stringify({testId:EX.test.id,attempt:EX.attempt,cur:EX.cur,left:EX.left,at:Date.now()}));}
  catch(e){/* quota — the attempt still lives in memory */}
}
function clearAutosave(){try{localStorage.removeItem(RESUME_KEY);}catch(e){}}
function pendingResume(){
  try{const r=JSON.parse(localStorage.getItem(RESUME_KEY)||"null");
    return r&&r.left>10&&testById(r.testId)?r:null;}catch(e){return null;}
}
function startExam(testId,resume){
  const t=testById(testId);if(!t)return;
  const attempt=resume?resume.attempt:{id:uid(),testId,startedAt:Date.now(),responses:{},submittedAt:null};
  t.questions.forEach(q=>attempt.responses[q.id]=attempt.responses[q.id]||{ans:null,status:"notvisited",time:0,changes:0});
  EX={test:t,attempt,cur:resume?resume.cur:0,left:resume?resume.left:t.duration,lastTick:Date.now(),warned:{}};
  if(!resume&&t.cloud)registerAttempt(t.id);
  examAutosave();
  $("#examView").classList.remove("hide");
  $("#exTitle").textContent=t.name;
  $("#exCand").textContent=S.settings.candidate;
  buildSubTabs();buildFoot();drawQuestion();startTimer();
  document.body.style.overflow="hidden";
}
function endExamUI(){$("#examView").classList.add("hide");document.body.style.overflow="";clearInterval(EX&&EX.timerId);EX=null;}
function subjectsInTest(){return [...new Set(EX.test.questions.map(q=>q.subject))];}
function buildSubTabs(){
  const w=$("#exSubs");w.innerHTML="";
  subjectsInTest().forEach(s=>{
    const b=el("button",null,s);
    b.onclick=()=>{const i=EX.test.questions.findIndex(q=>q.subject===s);if(i>=0){commitTime();EX.cur=i;drawQuestion();}};
    w.appendChild(b);
  });
}
function syncTabs(){
  const cs=EX.test.questions[EX.cur].subject;
  [...$("#exSubs").children].forEach(b=>b.className=b.textContent===cs?"active":"");
}
function buildFoot(){
  const f=$("#exFoot");f.innerHTML="";
  const mk=(cls,label,fn)=>{const b=el("button","btn "+cls,label);b.onclick=fn;f.appendChild(b);return b;};
  mk("ghost","◀ Previous",()=>move(-1));
  mk("ghost","Clear Response",()=>{const q=cq();const r=res(q);r.ans=null;r.status="notanswered";drawQuestion();});
  mk("purple","Mark for Review & Next",()=>{const r=res(cq());r.status=r.ans?"markedans":"marked";move(1,true);});
  mk("green","Save & Next",()=>{const r=res(cq());r.status=r.ans?"answered":"notanswered";move(1,true);});
  mk("ghost","Next ▶",()=>move(1));
  const sp=el("div");sp.style.flex="1";f.appendChild(sp);
  mk("red","Submit Test",()=>confirmBox("Submit test?",summaryHTML(),()=>submitExam(false),"Submit"));
}
const cq=()=>EX.test.questions[EX.cur];
const res=q=>EX.attempt.responses[q.id];
function commitTime(){
  const now=Date.now(); const q=cq(); if(q) res(q).time+=(now-EX.lastTick)/1000;
  EX.lastTick=now;
}
function move(d,keep){
  commitTime();
  const n=EX.cur+d;
  if(n<0||n>=EX.test.questions.length){if(keep)toast("End of paper");return;}
  EX.cur=n;drawQuestion();
}
function drawQuestion(){
  const q=cq(),r=res(q);
  if(r.status==="notvisited")r.status=r.ans?"answered":"notanswered";
  EX.lastTick=Date.now();
  const p=$("#exQ");p.innerHTML="";
  const head=el("div","row");head.style.justifyContent="space-between";
  head.innerHTML=`<div><b>Question ${q.no}</b> <span class="chip" style="color:${SUBCOLOR[q.subject]}">${esc(q.subject)}</span>
    <span class="badge">${q.type==="mcq"?"Single Correct (+4 / -1)":"Numerical (+4 / -1)"}</span></div>
    <div class="small muted">${EX.cur+1} of ${EX.test.questions.length}</div>`;
  p.appendChild(head);
  const box=el("div","card");box.style.margin="10px 0";
  box.appendChild(imgTag(q.img));
  if(q.type==="mcq"){
    q.options.forEach(o=>{
      const row=el("div","optrow"+(r.ans===o.label?" sel":""));
      row.appendChild(el("div","optlab",o.label.toUpperCase()));
      const w=el("div");w.style.flex="1";w.appendChild(imgTag(o.img));row.appendChild(w);
      row.onclick=()=>{if(r.ans!==o.label)r.changes++;r.ans=o.label;
        if(r.status!=="marked"&&r.status!=="markedans")r.status="answered";else r.status="markedans";
        drawQuestion();};
      box.appendChild(row);
    });
  } else {
    const inp=el("input");inp.type="text";inp.inputMode="decimal";inp.placeholder="Enter numerical answer";
    inp.value=r.ans==null?"":r.ans;inp.style.marginTop="10px";inp.style.width="240px";
    inp.oninput=()=>{r.changes++;r.ans=inp.value.trim()||null;paintPalette();};
    box.appendChild(inp);
  }
  p.appendChild(box);
  syncTabs();paintPalette();
}
function counts(){
  const c={answered:0,notanswered:0,marked:0,markedans:0,notvisited:0};
  EX.test.questions.forEach(q=>{const r=res(q);
    const st=r.status==="notvisited"?"notvisited":(r.status==="marked"||r.status==="markedans")?
      (r.ans?"markedans":"marked"):(r.ans?"answered":"notanswered");
    c[st]++;});
  return c;
}
function paintPalette(){
  const p=$("#exPal");const c=counts();
  p.innerHTML=`<div class="legend">
    <span><i class="dot" style="background:var(--green)"></i>Answered ${c.answered}</span>
    <span><i class="dot" style="background:var(--red)"></i>Not Answered ${c.notanswered}</span>
    <span><i class="dot" style="background:var(--purple)"></i>Marked ${c.marked+c.markedans}</span>
    <span><i class="dot" style="background:var(--panel)"></i>Not Visited ${c.notvisited}</span>
  </div>`;
  subjectsInTest().forEach(s=>{
    p.appendChild(el("div","small muted",`<b style="color:${SUBCOLOR[s]}">${s}</b>`));
    const g=el("div","pal-grid");g.style.margin="6px 0 12px";
    EX.test.questions.forEach((q,i)=>{
      if(q.subject!==s)return;
      const r=res(q);
      const st=r.status==="notvisited"?"":(r.status==="marked"||r.status==="markedans")?
        (r.ans?"markedans":"marked"):(r.ans?"answered":"notanswered");
      const b=el("button","pnum "+st+(i===EX.cur?" cur":""),String(q.no));
      b.onclick=()=>{commitTime();EX.cur=i;drawQuestion();};
      g.appendChild(b);
    });
    p.appendChild(g);
  });
  examAutosave();
}
function summaryHTML(){
  const c=counts();
  return `Answered <b>${c.answered+c.markedans}</b> · Not answered <b>${c.notanswered}</b> ·
   Marked for review <b>${c.marked+c.markedans}</b> · Not visited <b>${c.notvisited}</b>.<br>
   Time left <b>${fmtTime(EX.left)}</b>. You cannot change answers after submitting.`;
}
function startTimer(){
  const t=$("#exTimer");
  const upd=()=>{
    EX.left--;
    t.textContent=fmtTime(EX.left);
    t.className="timer"+(EX.left<=300?" crit":EX.left<=1800?" warn":"");
    [[1800,"30 minutes remaining"],[600,"10 minutes remaining"],[300,"5 minutes remaining"],[60,"1 minute remaining"]]
      .forEach(([s,m])=>{if(EX.left===s&&!EX.warned[s]){EX.warned[s]=1;toast("⚠ "+m,4000);}});
    if(EX.left%5===0){commitTime();examAutosave();}
    if(EX.left<=0)submitExam(true);
  };
  t.textContent=fmtTime(EX.left);
  EX.timerId=setInterval(upd,1000);
}
function submitExam(auto){
  commitTime();
  const {test,attempt}=EX;
  attempt.submittedAt=Date.now();
  attempt.timeTaken=(attempt.submittedAt-attempt.startedAt)/1000;
  attempt.autoSubmitted=!!auto;
  attempt.result=evaluate(test,attempt.responses);
  Object.values(attempt.responses).forEach(r=>r.time=Math.round(r.time));
  S.attempts.push(attempt);
  S.studyLog[todayKey(Date.now())]=(S.studyLog[todayKey(Date.now())]||0)+1;
  const pl=PLAN().find(p=>!p.done&&todayKey(p.date)===todayKey(Date.now()));
  if(pl)setPlannerDone(pl,true);
  save();clearAutosave();
  const id=attempt.id;
  endExamUI();
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  toast(auto?"Time up — test auto submitted":"Test submitted");
  go("result",id);
}

document.addEventListener("keydown",e=>{
  if(!EX||$("#examView").classList.contains("hide"))return;
  if(e.target.tagName==="INPUT")return;
  const k=e.key.toLowerCase();
  if(e.key==="ArrowRight")move(1);
  else if(e.key==="ArrowLeft")move(-1);
  else if(/^[1-4]$/.test(e.key)){const q=cq();if(q.type==="mcq"){const o=q.options[+e.key-1];if(o){res(q).ans=o.label;res(q).status="answered";drawQuestion();}}}
  else if(k==="m"){const r=res(cq());r.status=r.ans?"markedans":"marked";paintPalette();}
  else if(k==="c"){const r=res(cq());r.ans=null;r.status="notanswered";drawQuestion();}
  else if(k==="s"){const r=res(cq());r.status=r.ans?"answered":"notanswered";move(1,true);}
  else if(k==="p"){$("#exPal").classList.toggle("collapsed");}
  else if(k==="b"){const id=cq().id;const i=S.bookmarks.indexOf(id);i<0?S.bookmarks.push(id):S.bookmarks.splice(i,1);save();toast(i<0?"Bookmarked":"Bookmark removed",1200);}
  else if(e.key==="?"||k==="h")shortcutHelp();
});

/* ==========================================================================
   8. STUDY INTELLIGENCE — streaks, mastery, notebook, revision videos
   ========================================================================== */
function streakInfo(){
  const days=[];let streak=0;
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);days.push({key:todayKey(d),label:"SMTWTFS"[d.getDay()],on:!!S.studyLog[todayKey(d)]});}
  for(let i=0;i<400;i++){const d=new Date();d.setDate(d.getDate()-i);
    if(S.studyLog[todayKey(d)])streak++;else if(i>0)break;}
  const week=days.filter(d=>d.on).length;
  return {days:days.reverse(),streak,week};
}
function chapterMastery(){
  const acc={};
  S.attempts.filter(a=>a.submittedAt).forEach(a=>{
    const t=testById(a.testId);if(!t)return;
    t.questions.forEach(q=>{
      const key=q.chapter||q.subject;const o=acc[key]=acc[key]||{c:0,n:0,sub:q.subject,time:0};
      const r=a.responses[q.id]||{};o.n++;o.time+=r.time||0;if(isRight(q,r.ans))o.c++;});});
  return Object.entries(acc).map(([name,v])=>({name,sub:v.sub,n:v.n,acc:pct(v.c,v.n),
    level:pct(v.c,v.n)>=85?"Mastered":pct(v.c,v.n)>=70?"Strong":pct(v.c,v.n)>=50?"Developing":"Needs work"}))
    .sort((a,b)=>a.acc-b.acc);
}
function wrongQuestions(){
  const out=[];const seen=new Set();
  S.attempts.filter(a=>a.submittedAt).slice().reverse().forEach(a=>{
    const t=testById(a.testId);if(!t)return;
    t.questions.forEach(q=>{
      const r=a.responses[q.id]||{};
      if(r.ans==null||r.ans===""||isRight(q,r.ans))return;
      if(seen.has(q.id))return;seen.add(q.id);
      out.push({q,t,ans:r.ans,when:a.submittedAt,time:r.time||0});});});
  return out;
}

    clearTimeout(window.__libT);window.__libT=setTimeout(()=>{render();

/* Offline mode: register the generated worker only in a real published tab.
   Never in dev, never inside the Lovable preview iframe, and ?sw=off cleans up. */
(function registerOfflineWorker(){
  if(!("serviceWorker" in navigator))return;
  const h=location.hostname, inFrame=window.top!==window.self;
  const blocked=inFrame||location.search.includes("sw=off")||
    /^(localhost|127\.0\.0\.1)$/.test(h)||h.startsWith("id-preview--")||h.startsWith("preview--")||
    /(^|\.)lovableproject\.com$/.test(h)||/(^|\.)lovableproject-dev\.com$/.test(h)||
    /(^|\.)beta\.lovable\.dev$/.test(h);
  if(blocked){
    navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{
      if(r.active&&r.active.scriptURL.endsWith("/sw.js"))r.unregister();}));
    return;
  }
  addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
})();
