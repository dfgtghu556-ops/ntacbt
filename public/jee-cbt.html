/* The Vedantu HWT papers have a fixed structure:
   [2-column question pages] -> "Answer Key" grid -> "Solutions" (single column).
   Strategy: locate question numbers via text coordinates, then CROP the rendered
   page bitmap for each question / option / solution. Cropping preserves
   equations, tables and figures exactly as printed.                          */

const RENDER_SCALE=2.0;

function trimCanvas(cv){                     // remove surrounding white space
  const ctx=cv.getContext("2d"),w=cv.width,h=cv.height;
  if(!w||!h) return cv;
  const d=ctx.getImageData(0,0,w,h).data;
  let top=h,left=w,right=0,bottom=0,found=false;
  for(let y=0;y<h;y++){for(let x=0;x<w;x++){const i=(y*w+x)*4;
    if(d[i]<245||d[i+1]<245||d[i+2]<245){found=true;
      if(y<top)top=y; if(y>bottom)bottom=y; if(x<left)left=x; if(x>right)right=x;}}}
  if(!found) return null;
  const pad=6;
  left=clamp(left-pad,0,w); top=clamp(top-pad,0,h);
  right=clamp(right+pad,0,w); bottom=clamp(bottom+pad,0,h);
  const out=document.createElement("canvas");
  out.width=right-left; out.height=bottom-top;
  out.getContext("2d").drawImage(cv,left,top,out.width,out.height,0,0,out.width,out.height);
  return out;
}
async function cropStore(pageCanvas,x0,y0,x1,y1){
  const w=Math.max(1,Math.round((x1-x0)*RENDER_SCALE)),h=Math.max(1,Math.round((y1-y0)*RENDER_SCALE));
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const c=cv.getContext("2d"); c.fillStyle="#fff"; c.fillRect(0,0,w,h);
  c.drawImage(pageCanvas,x0*RENDER_SCALE,y0*RENDER_SCALE,w,h,0,0,w,h);
  const t=trimCanvas(cv); if(!t) return null;
  const key="img:"+uid();
  await imgPut(key,t.toDataURL("image/jpeg",0.78));
  return key;
}
/** Extract text items with top-left coordinates in PDF points. */
async function pageItems(page){
  const vp=page.getViewport({scale:1}); const tc=await page.getTextContent();
  return {W:vp.width,H:vp.height,items:tc.items.filter(i=>i.str.trim()).map(i=>({
    s:i.str.trim(), x:i.transform[4], y:vp.height-i.transform[5], h:Math.abs(i.transform[3])||10
  }))};
}
async function renderPage(page){
  const vp=page.getViewport({scale:RENDER_SCALE});
  const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height;
  const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  return cv;
}
/** Text inside a rectangle (used for search + AI topic hints). */
function textIn(items,x0,y0,x1,y1){
  return items.filter(i=>i.x>=x0-2&&i.x<=x1&&i.y>=y0-2&&i.y<=y1)
    .sort((a,b)=>a.y-b.y||a.x-b.x).map(i=>i.s).join(" ").replace(/\s+/g," ").trim();
}

/** Layer 6 helper: this is the "intelligent PDF" fallback — instead of
 *  relying only on where text sits on the page, it sends the AI actual
 *  page IMAGES (up to 8 pages, to keep the request small and fast) plus
 *  the extracted text, so it can genuinely "read" the page like a human
 *  would — tables, matched-list questions, odd layouts, even scanned/
 *  image-heavy pages. Falls back to text-only if rendering an image fails
 *  for some reason. Returns the same question-object shape the
 *  position-based layers build, but with img:null (nothing to crop
 *  without coordinates) — the UI shows q.text/o.text in that case. */
async function aiFallbackParse(pages, akPos, solPos, subject){
  const endPage = (solPos&&solPos.p) ? solPos.p : pages.length;
  const lines=[]; const images=[];
  for(const p of pages){
    if(p.n>endPage) break;
    p.items.slice().sort((a,b)=>a.y-b.y||a.x-b.x).forEach(i=>lines.push(i.s));
    if(images.length<8){
      try{
        const cv=p.canvas||(p.canvas=await renderPage(p.pg));
        const blob=await new Promise(res=>cv.toBlob(res,"image/jpeg",0.72));
        const dataUrl=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(blob);});
        images.push({mimeType:"image/jpeg",data:dataUrl.split(",")[1]||""});
      }catch(e){/* if a page fails to rasterize, the AI still has its text */}
    }
  }
  const text=lines.join(" ").replace(/\s+/g," ").trim();
  if(!text && !images.length) return null;
  const r=await fetch("/api/public/pdf-reformat",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({text,subject,images})
  });
  if(!r.ok) return null;
  const data=await r.json().catch(()=>null);
  const raw=data&&data.questions;
  if(!raw||!raw.length) return null;
  return raw.filter(q=>q&&q.text&&q.text.trim())
    .sort((a,b)=>a.no-b.no)
    .map((q,idx)=>({
      id:uid(), subject, no:idx+1, type:q.type==="integer"?"integer":"mcq",
      text:String(q.text).trim(), img:null,
      options:(q.options||[]).slice(0,4).map(o=>({
        label:String(o.label||"").replace(/[().:]/g,"").toLowerCase(),
        text:String(o.text||"").trim(), img:null
      })),
      answer:q.answer==null?null:(q.type==="integer"?String(q.answer).replace(/[^0-9.\-]/g,""):String(q.answer).toLowerCase())
    }));
}

async function parsePaper(file,subject,onProgress){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const pages=[];
  for(let p=1;p<=pdf.numPages;p++){
    const pg=await pdf.getPage(p);
    const meta=await pageItems(pg);
    pages.push({n:p,pg,...meta,canvas:null});
    onProgress&&onProgress(`Reading page ${p}/${pdf.numPages}`);
  }
  const canvasOf=async pi=>pi.canvas||(pi.canvas=await renderPage(pi.pg));

  // ---- locate section markers (tolerant of common header wording) ----
  const AK_RE=/^(answer\s*keys?|answers?)$/i;
  const SOL_RE=/^(solutions?|explanations?|explanatory\s*notes?)$/i;
  let akPos=null, solPos=null;
  pages.forEach(p=>p.items.forEach(i=>{
    if(!akPos && AK_RE.test(i.s)) akPos={p:p.n,y:i.y};
    if(!solPos && SOL_RE.test(i.s)) solPos={p:p.n,y:i.y};
  }));
  akPos=akPos||{p:pages.length,y:0}; solPos=solPos||{p:pages.length,y:0};
  const before=(a,b)=>a.p<b.p||(a.p===b.p&&a.y<b.y);

  /* ---- question-number detection: layered strategies -------------------
     1) STRICT — the exact original two-column template. Runs first and,
        for papers already in that format, produces identical results to
        before (same thresholds, same strict 1-2-3 sequencing).
     2) ADAPTIVE — for papers whose margins/column widths differ, the
        column split is *measured* from where the numbers actually cluster
        instead of assumed, and the sequence walk tolerates a few missed
        or misread numbers instead of aborting at the first gap (a single
        OCR/font glitch used to kill detection of every question after it).
     3) ADAPTIVE, forced single column — for one-column papers.
     Only the first strategy that finds any markers is used, so a paper
     that already parses correctly today keeps parsing exactly the same
     way. ------------------------------------------------------------- */
  const numRe=/^\(?q?\.?\s*(\d{1,3})[.):]\)?$/i;
  const optRe=/^\(?([a-dA-D])[.):]\)?$/;

  function strictTwoColumn(){
    const marks=[]; let expect=1;
    for(const p of pages){
      if(p.n>akPos.p) break;
      const W=p.W;
      const cands=p.items.filter(i=>numRe.test(i.s)&&(i.x<W*0.12||(i.x>W*0.48&&i.x<W*0.62)))
        .map(i=>({...i,col:i.x<W*0.5?0:1,page:p}))
        .sort((a,b)=>a.col-b.col||a.y-b.y);
      for(const c of cands){
        if(p.n===akPos.p && c.y>=akPos.y-4) continue;
        if(+c.s.replace(/\D/g,"")===expect){marks.push(c);expect++;}
      }
    }
    return marks;
  }
  function gatherCandidates(){
    const items=[];
    for(const p of pages){
      if(p.n>akPos.p) break;
      p.items.forEach(i=>{
        if(p.n===akPos.p && i.y>=akPos.y-4) return;
        if(numRe.test(i.s)) items.push({...i,page:p});
      });
    }
    return items;
  }
  function detectColumnBoundary(cands){
    if(cands.length<6) return null;
    const fracs=cands.map(c=>c.x/c.page.W).sort((a,b)=>a-b);
    let bestGap=0,bestAt=-1;
    for(let i=1;i<fracs.length;i++){
      const mid=(fracs[i]+fracs[i-1])/2, gap=fracs[i]-fracs[i-1];
      if(mid>0.25&&mid<0.75&&gap>bestGap){bestGap=gap;bestAt=i;}
    }
    if(bestAt<0||bestGap<0.06||bestAt<3||(fracs.length-bestAt)<3) return null;
    return (fracs[bestAt]+fracs[bestAt-1])/2;
  }
  function adaptiveWalk(cands, boundaryFrac){
    const marks=[]; let last=0;
    for(const p of pages){
      if(p.n>akPos.p) break;
      const W=p.W, boundaryX=boundaryFrac==null?Infinity:W*boundaryFrac;
      const leftBand0=boundaryFrac==null?W*0.16:boundaryX*0.22;
      const rightBand=boundaryFrac==null?0:(W-boundaryX)*0.22;
      const pcands=cands.filter(c=>c.page===p)
        .map(i=>({...i,col:i.x<boundaryX?0:1}))
        .filter(i=>i.col===0?i.x<Math.max(leftBand0,W*0.05):(i.x-boundaryX)<rightBand)
        .sort((a,b)=>a.col-b.col||a.y-b.y);
      for(const c of pcands){
        const n=+c.s.replace(/\D/g,"");
        if(n>last&&n<=last+6){marks.push(c);last=n;}
      }
    }
    return marks;
  }

  /* ---- Run every layer's strategy up front, THEN pick the best result,
     instead of stopping at the first layer that found ANYTHING. The old
     "stop at first non-empty" approach meant a layer that only partially
     matched (say, 3 questions out of 75, because the rest of the paper's
     layout didn't fit that strategy) would "win" by accident and starve
     every stronger layer below it of a chance to run. Now: compute all
     five, then choose the earliest (strictest/most reliable) layer whose
     count is close to the best count found by ANY layer — falling through
     to a looser layer only when a stricter one is clearly incomplete. ---- */
  const rawCands=gatherCandidates();
  const boundary=detectColumnBoundary(rawCands);
  const numPrefixRe=/^\(?q?\.?\s*(\d{1,3})[.):]\s*/i;
  function textAnchoredLayer(marginFrac){
    const items=[];
    for(const p of pages){
      if(p.n>akPos.p) break;
      p.items.forEach(i=>{
        if(p.n===akPos.p && i.y>=akPos.y-4) return;
        const m=numPrefixRe.exec(i.s);
        if(m && (marginFrac==null || i.x<p.W*marginFrac)) items.push({...i,page:p,numVal:+m[1]});
      });
    }
    const marks=[]; let last=0;
    items.sort((a,b)=>a.page.n-b.page.n||a.y-b.y||a.x-b.x).forEach(c=>{
      if(c.numVal>last && c.numVal<=last+6){marks.push(c);last=c.numVal;}
    });
    return marks;
  }
  const candidates=[
    {marks:strictTwoColumn(), mode:"layout-strict", boundaryFrac:0.5},
    {marks:adaptiveWalk(rawCands, boundary), mode:boundary==null?"layout-adaptive-1col":"layout-adaptive-2col", boundaryFrac:boundary==null?1:boundary},
    {marks:adaptiveWalk(rawCands, null), mode:"layout-adaptive-1col-forced", boundaryFrac:1},
    /* ---- Layer 4: many real-world PDFs don't isolate "25)" as its own
       text run — it's glued to the start of the question ("25) What is…"
       all one item). The strategies above require the WHOLE item to be
       just the number, so they find nothing. This layer instead looks for
       a number PATTERN AT THE START of any item, wherever it sits on the
       page (only a generous left-side tolerance, not a fixed column band),
       so differently-margined or single-run PDFs still get picked up. ---- */
    {marks:textAnchoredLayer(0.30), mode:"text-anchored", boundaryFrac:1},
    // Layer 5 — truly last resort: same idea, but with no left-margin
    // limit at all, for papers where numbering isn't near the margin.
    {marks:textAnchoredLayer(null), mode:"text-anchored-unbounded", boundaryFrac:1},
  ];
  const maxCount=Math.max(...candidates.map(c=>c.marks.length));
  let chosen=candidates.find(c=>c.marks.length>0 && c.marks.length>=maxCount*0.9) || candidates.find(c=>c.marks.length>0) || candidates[candidates.length-1];
  let qMarks=chosen.marks, boundaryFrac=chosen.boundaryFrac, parseMode=chosen.mode;
  if(!qMarks.length){
    /* ---- Layer 6: every position-based strategy above failed — the PDF's
       layout is unlike anything the layout parser was tuned for. As a last
       resort, send the raw page text (no coordinates) to an AI endpoint
       that restructures it into questions/options/answers directly. This
       never runs for a PDF that already parses via Layers 1-5, so it can't
       change behavior for any paper that works today. ---- */
    onProgress&&onProgress(`${subject}: standard layout not detected, trying AI fallback…`);
    const aiQuestions=await aiFallbackParse(pages, akPos, solPos, subject).catch(e=>{
      console.warn("AI fallback failed:",e);
      return null;
    });
    if(aiQuestions&&aiQuestions.length){
      const questions=aiQuestions;
      questions.parseMode="ai-fallback";
      const noKeyCount=questions.filter(q=>!q.answer).length;
      questions.warning=`This PDF's layout couldn't be read by the normal parser, so an AI assistant read the raw text instead and found ${questions.length} question(s)${noKeyCount?`, but ${noKeyCount} have no detected answer — check those before publishing`:""}. Because no page coordinates were available, questions show as plain text (no cropped images) and reading order across multi-column pages may occasionally be mixed up — please review every question and answer below carefully before publishing.`;
      return questions;
    }
    const found=gatherCandidates().length;
    const err=new Error(found
      ? `Found ${found} number-like marker(s) in ${subject}, but couldn't line them into a 1, 2, 3… sequence. Make sure questions are numbered consecutively starting at 1.`
      : `No question numbers were detected in ${subject}. Each question should start with a number like "1." or "Q1)".`);
    err.code="NO_QUESTIONS"; throw err;
  }

  // ---- build question objects ----
  const gut=0.005;
  const questions=[];
  for(let k=0;k<qMarks.length;k++){
    const m=qMarks[k], p=m.page, W=p.W, H=p.H;
    const x0=m.col?W*(boundaryFrac+gut):W*0.02, x1=m.col?W*0.99:W*(boundaryFrac-gut);
    const nxt=qMarks[k+1];
    let yEnd;
    if(nxt&&nxt.page.n===p.n&&nxt.col===m.col) yEnd=nxt.y-(nxt.h||10)-4;
    else if(p.n===akPos.p) yEnd=akPos.y-6;
    else yEnd=H-28;
    const yTop=m.y-m.h-4;
    const cv=await canvasOf(p);
    // options — isolated "(a)" markers first; if that finds fewer than 2,
    // try options glued to their own text ("a) 25 m/s" as one run), which
    // is common in PDFs that weren't built with a fixed marker column.
    const optPrefixRe=/^\(?([a-dA-D])[.):]\s+/;
    let opts=p.items.filter(i=>optRe.test(i.s)&&i.x>=x0&&i.x<=x0+W*0.10&&i.y>yTop&&i.y<yEnd)
      .sort((a,b)=>a.y-b.y);
    let glued=false;
    if(opts.length<2){
      const g=p.items.filter(i=>optPrefixRe.test(i.s)&&i.x>=x0&&i.x<x1&&i.y>yTop&&i.y<yEnd)
        .sort((a,b)=>a.y-b.y);
      if(g.length>=2){opts=g;glued=true;}
    }
    const stemEnd=opts.length?opts[0].y-opts[0].h-2:yEnd;
    const q={
      id:uid(), subject, no:k+1, type:opts.length>=4?"mcq":"integer",
      text:textIn(p.items,x0,yTop,x1,stemEnd),
      img:await cropStore(cv,x0,yTop,x1,stemEnd), options:[]
    };
    for(let o=0;o<opts.length;o++){
      const oy=opts[o].y-opts[o].h-2;
      const oe=o+1<opts.length?opts[o+1].y-opts[o+1].h-2:yEnd;
      if(glued){
        const mm=optPrefixRe.exec(opts[o].s);
        q.options.push({
          label:(mm?mm[1]:String.fromCharCode(97+o)).toLowerCase(),
          text:opts[o].s.slice(mm?mm[0].length:0).trim(),
          img:await cropStore(cv,x0,oy,x1,oe)
        });
      } else {
        const ox=opts[o].x+13;   // skip the printed "(a)" label — the UI draws its own
        q.options.push({
          label:opts[o].s.replace(/[().:]/g,"").toLowerCase(),
          text:textIn(p.items,ox,oy,x1,oe),
          img:await cropStore(cv,ox,oy,x1,oe)
        });
      }
    }
    questions.push(q);
    onProgress&&onProgress(`${subject}: question ${k+1}/${qMarks.length}`);
  }

  // ---- answer key grid: pairs of (index row, answer row) ----
  const keyItems=[];
  pages.forEach(p=>{
    if(p.n<akPos.p||p.n>solPos.p) return;
    p.items.forEach(i=>{
      const after = p.n>akPos.p || i.y>akPos.y+2;
      const beforeSol = p.n<solPos.p || i.y<solPos.y-2;
      if(after&&beforeSol) keyItems.push({...i,page:p.n});
    });
  });
  const rows=[];
  keyItems.sort((a,b)=>a.page-b.page||a.y-b.y||a.x-b.x).forEach(i=>{
    const last=rows[rows.length-1];
    if(last&&last.page===i.page&&Math.abs(last.y-i.y)<6){last.cells.push(i);last.y=(last.y+i.y)/2;}
    else rows.push({page:i.page,y:i.y,cells:[i]});
  });
  const answers={}; let pending=null;
  for(const r of rows){
    const cells=r.cells.sort((a,b)=>a.x-b.x).map(c=>c.s);
    const allIdx=cells.length>1&&cells.every(c=>/^\d{1,3}$/.test(c))&&
      cells.every((c,i2)=>i2===0||+c===+cells[i2-1]+1);
    if(allIdx&&(!pending)){pending=cells.map(Number);continue;}
    if(pending&&cells.length===pending.length){
      pending.forEach((n,i2)=>answers[n]=cells[i2]);
      pending=null;
    } else if(allIdx){pending=cells.map(Number);}
  }
  // The answer key is the source of truth for question type:
  // a letter => single-correct MCQ, a number => numerical (integer) question.
  // If no separate answer-key section was found (or a question's row is
  // missing from it), fall back to an inline "Ans: B" style tag that may
  // sit right in that question's own extracted text — common in PDFs that
  // give the answer right after each question instead of in a separate key.
  const inlineAnsRe=/(?:ans(?:wer)?|correct\s*option|correct\s*answer)\s*[:\-]?\s*\(?([a-dA-D]|\d{1,3}(?:\.\d+)?)\)?\s*$/i;
  questions.forEach(q=>{
    let raw=(answers[q.no]||"").trim();
    if(!raw){
      const hay=(q.text+" "+(q.options||[]).map(o=>o.text).join(" ")).trim();
      const m=inlineAnsRe.exec(hay);
      if(m)raw=m[1];
    }
    const isLetter=/^[a-dA-D]$/.test(raw);
    if(isLetter){q.type="mcq";q.answer=raw.toLowerCase();}
    else if(raw){q.type="integer";q.options=[];q.answer=raw.replace(/[^0-9.\-]/g,"");}
    else if(q.options.length>=2){q.type="mcq";q.answer=null;}   // no key found anywhere — keep options, flag for manual review
    else {q.type="integer";q.answer=null;}
  });

  // ---- solutions (single column, same gap-tolerant walk as questions) ----
  const solMarks=[]; let lastSol=0;
  for(const p of pages){
    if(p.n<solPos.p) continue;
    const cands=p.items.filter(i=>numRe.test(i.s)&&i.x<p.W*0.14&&(p.n>solPos.p||i.y>solPos.y))
      .sort((a,b)=>a.y-b.y);
    for(const c of cands){
      const n=+c.s.replace(/\D/g,"");
      if(n>lastSol&&n<=lastSol+6){solMarks.push({...c,page:p});lastSol=n;}
    }
  }
  for(let k=0;k<solMarks.length;k++){
    const m=solMarks[k],p=m.page,q=questions[k]; if(!q) break;
    const nxt=solMarks[k+1];
    const yEnd=(nxt&&nxt.page.n===p.n)?nxt.y-(nxt.h||10)-4:p.H-26;
    const cv=await canvasOf(p);
    q.solText=textIn(p.items,p.W*0.02,m.y-m.h-3,p.W*0.99,yEnd);
    q.solImg=await cropStore(cv,p.W*0.02,m.y-m.h-3,p.W*0.99,yEnd);
    onProgress&&onProgress(`${subject}: solution ${k+1}/${solMarks.length}`);
  }
  pages.forEach(p=>p.canvas=null);
  questions.parseMode=parseMode;
  const noKeyCount=questions.filter(q=>!q.answer).length;
  questions.warning = parseMode==="layout-strict" ? null
    : parseMode.startsWith("text-anchored")
      ? `This PDF's layout was different enough that a flexible, text-based detector was used instead of the usual column layout. ${questions.length} question(s) were found${noKeyCount?`, but ${noKeyCount} have no detected answer — check those before publishing`:""}. Please review the questions and answer key below.`
      : "This PDF didn't match the standard two-column layout exactly, so a more flexible detector was used. Please double-check the questions and answer key below before publishing.";
  return questions;
}

/* --------------------------- 4. TEST / SCORING --------------------------- */
const MARK_C=4, MARK_W=-1, TEST_MINUTES=180;
function buildTest(name,packs){
  const questions=[];
  SUBJECTS.forEach(sub=>(packs[sub]||[]).forEach(q=>questions.push(q)));
  questions.forEach((q,i)=>q.index=i);
  return {id:uid(),name,createdAt:Date.now(),date:new Date().toISOString(),
          duration:TEST_MINUTES*60,questions,chapter:{}};
}
function testById(id){return S.tests.find(t=>t.id===id);}
function attemptsOf(id){return S.attempts.filter(a=>a.testId===id);}
function isRight(q,ans){
  if(ans==null||ans==="")return false;
  if(q.type==="mcq")return String(ans).toLowerCase()===String(q.answer||"").toLowerCase();
  const a=parseFloat(ans),b=parseFloat(q.answer);
  return isFinite(a)&&isFinite(b)&&Math.abs(a-b)<0.01;
}
function evaluate(test,resp){
  const markW=S.settings.negMarking===false?0:MARK_W;
  const per={},all={correct:0,wrong:0,skipped:0,marks:0,neg:0,time:0,total:test.questions.length};
  SUBJECTS.forEach(s=>per[s]={correct:0,wrong:0,skipped:0,marks:0,total:0,time:0});
  test.questions.forEach(q=>{
    const r=resp[q.id]||{}; const p=per[q.subject]; p.total++;
    const t=r.time||0; p.time+=t; all.time+=t;
    if(r.ans==null||r.ans===""){p.skipped++;all.skipped++;}
    else if(isRight(q,r.ans)){p.correct++;all.correct++;p.marks+=MARK_C;all.marks+=MARK_C;}
    else {p.wrong++;all.wrong++;p.marks+=markW;all.marks+=markW;all.neg+=Math.abs(markW);}
  });
  const attempted=all.correct+all.wrong;
  all.accuracy=pct(all.correct,attempted);
  all.percentage=pct(all.marks,all.total*MARK_C);
  all.max=all.total*MARK_C;
  return {per,all};
}

/* --------------------------- 5. AI ANALYSIS ------------------------------ */
/* Deterministic, on-device analysis engine (no network). */
function analyse(test,attempt){
  const r=attempt.result, resp=attempt.responses, qs=test.questions;
  const times=qs.map(q=>(resp[q.id]||{}).time||0);
  const avgT=times.reduce((a,b)=>a+b,0)/(qs.length||1);
  const rows=qs.map(q=>{
    const x=resp[q.id]||{};
    const status=(x.ans==null||x.ans==="")?"skipped":(isRight(q,x.ans)?"correct":"wrong");
    return {q,ans:x.ans,time:x.time||0,status,chapter:q.chapter||test.chapter[q.subject]||q.subject+" — General",
      guess:(x.changes||0)>2||((x.time||0)<20&&status!=="skipped")};
  });
  const bySub={};SUBJECTS.forEach(s=>bySub[s]=r.per[s]);
  const strongSub=SUBJECTS.slice().sort((a,b)=>bySub[b].marks-bySub[a].marks);
  const chMap={};
  rows.forEach(x=>{const c=chMap[x.chapter]=chMap[x.chapter]||{c:0,w:0,s:0,t:0,n:0};
    c.n++;c.t+=x.time;c[x.status==="correct"?"c":x.status==="wrong"?"w":"s"]++;});
  const chapters=Object.entries(chMap).map(([k,v])=>({name:k,...v,acc:pct(v.c,v.n)}));
  const slow=rows.slice().sort((a,b)=>b.time-a.time).slice(0,5);
  const easyMissed=rows.filter(x=>x.status!=="correct"&&x.time<avgT*0.6);
  const hardSolved=rows.filter(x=>x.status==="correct"&&x.time>avgT*1.6);
  const careless=rows.filter(x=>x.status==="wrong"&&x.time<avgT*0.5);
  const calc=rows.filter(x=>x.status==="wrong"&&x.time>avgT*1.3);
  const conceptual=rows.filter(x=>x.status==="wrong"&&x.time>=avgT*0.5&&x.time<=avgT*1.3);
  const guesses=rows.filter(x=>x.guess&&x.status!=="skipped");
  const guessAcc=pct(guesses.filter(g=>g.status==="correct").length,guesses.length);
  // expected JEE metrics (300-mark scale)
  const score300=Math.round(r.all.percentage/100*300);
  const percentile=+(clamp(100*(1-Math.exp(-Math.pow(score300/300,1.6)*3.6)),0.5,99.99)).toFixed(3);
  const rank=Math.max(1,Math.round((100-percentile)/100*1200000));
  const trend=S.attempts.filter(a=>a.submittedAt).sort((a,b)=>a.submittedAt-b.submittedAt).map(a=>a.result.all.percentage);
  const improving=trend.length>1?trend[trend.length-1]-trend[0]:0;
  const weakCh=chapters.slice().sort((a,b)=>a.acc-b.acc).slice(0,5);
  const strongCh=chapters.slice().sort((a,b)=>b.acc-a.acc).slice(0,5);
  const recs=[];
  if(r.all.accuracy<60)recs.push("Accuracy below 60% — attempt fewer questions but verify each step before locking the answer.");
  if(careless.length>2)recs.push(`${careless.length} careless errors detected (fast wrong answers). Re-read the question stem once before answering.`);
  if(calc.length>2)recs.push(`${calc.length} likely calculation errors. Practise timed numerical drills without a calculator.`);
  if(r.all.skipped>15)recs.push(`${r.all.skipped} questions left unattempted — improve speed with sectional timing (36 min per subject block).`);
  if(guesses.length>5&&guessAcc<35)recs.push("Guess accuracy is poor; avoid negative marking by skipping when unsure between more than 2 options.");
  strongSub.slice(-1).forEach(s=>recs.push(`${s} is your lowest scoring subject — allocate 40% of daily revision to it this week.`));
  weakCh.slice(0,3).forEach(c=>recs.push(`Revise "${c.name}" — accuracy only ${c.acc}%.`));
  if(!recs.length)recs.push("Excellent balanced performance — maintain the current routine and increase difficulty.");
  return {rows,avgT,chapters,weakCh,strongCh,slow,easyMissed,hardSolved,careless,calc,conceptual,
    guesses,guessAcc,score300,percentile,rank,improving,strongSub,recs};
}

function globalStats(){
  const done=S.attempts.filter(a=>a.submittedAt);
  const marks=done.map(a=>a.result.all.marks);
  const acc=done.map(a=>a.result.all.accuracy);
  const subAgg={};SUBJECTS.forEach(s=>subAgg[s]={c:0,n:0});
  done.forEach(a=>SUBJECTS.forEach(s=>{const p=a.result.per[s];if(p){subAgg[s].c+=p.correct;subAgg[s].n+=p.total;}}));
  const ranked=SUBJECTS.map(s=>({s,acc:pct(subAgg[s].c,subAgg[s].n),n:subAgg[s].n})).filter(x=>x.n).sort((a,b)=>b.acc-a.acc);
  return {done,total:done.length,avg:marks.length?Math.round(marks.reduce((x,y)=>x+y,0)/marks.length):0,
    high:marks.length?Math.max(...marks):0,avgAcc:acc.length?Math.round(acc.reduce((x,y)=>x+y,0)/acc.length*10)/10:0,
    strong:ranked[0],weak:ranked[ranked.length-1],ranked};
}

    mk.disabled=true;

  fsGrid.append(fsField("Test name",fsName),fsField("Year",fsYear),fsField("Difficulty",fsDiff));

  const fsSt=el("div","small muted");fsSt.style.marginTop="10px";fsSt.textContent="No file selected.";
  const fsIn=el("input");fsIn.type="file";fsIn.accept="application/pdf";fsIn.className="hide";
  const fsBtn=el("button","btn","Upload & Publish Full Syllabus PDF");
  fsBtn.onclick=()=>requireAdmin(()=>fsIn.click());
  fsIn.onchange=async()=>{

    fsBtn.disabled=true;

      if(!qs.length)throw new Error("No questions detected");
      if(qs.warning)fsSt.textContent=qs.warning;

    if(!dl.length)dn.innerHTML+=`<div class="empty"><div class="big">✅</div>Mark a test done from the Schedule tab to build your streak.</div>`;

/* Personal study calendar: revision reminders synced to every scheduled and
   uploaded test's chapters. Reminders are derived, so they always stay fresh. */
function studyReminders(rows){
  const now=Date.now(),DAY=864e5,out=[];
  const push=(date,title,detail,tag)=>out.push({date,title,detail,tag});
  rows.filter(r=>!r.done&&new Date(r.date).getTime()>=now-DAY).slice(0,10).forEach(r=>{
    const d=new Date(r.date).getTime(),topics=r.topics||r.subject;
    push(d-3*DAY,"Start revision · "+r.name,`Cover ${topics} — theory + one-shot video.`,r.subject);
    push(d-DAY,"Final revision · "+r.name,`Formulas and PYQs for ${topics}.`,r.subject);
    push(d,"Test day · "+r.name,`${r.time||"Scheduled"} · ${topics}`,r.subject);
  });
  cloudTests.filter(t=>!attemptsOf(t.id).some(x=>x.submittedAt)).slice(0,6).forEach(t=>{
    const chaps=(t.meta&&t.meta.chapters||[]).slice(0,4).join(", ")||"Full syllabus";
    push(now+DAY,"Attempt · "+t.name,`${t.questions.length} questions · ${chaps}`,t.meta?.type||"Mock");
  });
  return out.filter(x=>x.date>=now-DAY).sort((a,b)=>a.date-b.date).slice(0,12);
}

/** Draws a shareable, WhatsApp-friendly result card (1080×1350, portrait,

  c.textAlign="left";

  // stat pills
  const pills=[["Accuracy",r.all.accuracy+"%"],["Percentile",ai.percentile],["Correct",r.all.correct],["Wrong",r.all.wrong]];
  const pw=(W-60*2-30*3)/4;
  pills.forEach((p,i)=>{
    const x=60+i*(pw+30),y=770,ph=170;

    c.fillText(String(p[0]).toUpperCase(),x+pw/2,y+118);

  // subject bars
  let by=1010;
  c.textAlign="left";c.fillStyle="rgba(255,255,255,.6)";c.font="600 22px 'Nunito Sans',sans-serif";
  c.fillText("SUBJECT-WISE MARKS",60,by);
  by+=30;
  const subCols={Physics:"#4f9cf9",Chemistry:"#3ecf8e",Mathematics:"#f2a83e"};
  const maxM=Math.max(1,...SUBJECTS.map(s=>r.per[s]?.marks||0));
  SUBJECTS.forEach(s=>{
    const p=r.per[s];if(!p||!p.total)return;
    c.fillStyle="rgba(255,255,255,.85)";c.font="600 24px 'Nunito Sans',sans-serif";
    c.fillText(s,60,by+18);

function wrapText(c,text,x,y,maxW,lh){
  const words=String(text).split(" ");let line="",yy=y;
  for(const w of words){
    const test=line+w+" ";
    if(c.measureText(test).width>maxW&&line){c.fillText(line,x,yy);line=w+" ";yy+=lh;}
    else line=test;
  }
  c.fillText(line,x,yy);
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function esc2(s){return String(s).replace(/[<>&]/g,"");}

function lineChart(cv,data,labels,title,color="#0b57a4"){
  const dpr=devicePixelRatio||1,w=cv.clientWidth,h=210;
  cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext("2d");c.scale(dpr,dpr);
  c.clearRect(0,0,w,h);
  const pad={l:36,r:12,t:18,b:26};
  const max=Math.max(1,...data),min=Math.min(0,...data);
  const X=i=>pad.l+(w-pad.l-pad.r)*(data.length<2?0.5:i/(data.length-1));
  const Y=v=>h-pad.b-(h-pad.t-pad.b)*((v-min)/((max-min)||1));
  c.strokeStyle=getComputedStyle(document.body).getPropertyValue("--line");c.lineWidth=1;
  for(let i=0;i<=4;i++){const y=pad.t+(h-pad.t-pad.b)*i/4;c.beginPath();c.moveTo(pad.l,y);c.lineTo(w-pad.r,y);c.stroke();
    c.fillStyle=getComputedStyle(document.body).getPropertyValue("--muted");c.font="10px sans-serif";
    c.fillText(Math.round(max-(max-min)*i/4),4,y+3);}
  c.strokeStyle=color;c.lineWidth=2.5;c.beginPath();
  data.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)));c.stroke();
  c.fillStyle=color+"22";c.lineTo(X(data.length-1),h-pad.b);c.lineTo(X(0),h-pad.b);c.closePath();c.fill();
  data.forEach((v,i)=>{c.fillStyle=color;c.beginPath();c.arc(X(i),Y(v),3.5,0,7);c.fill();});
  c.fillStyle=getComputedStyle(document.body).getPropertyValue("--muted");c.font="11px sans-serif";
  c.fillText(title,pad.l,12);
}
function donutChart(cv,slices,centerText){
  const c=cv.getContext("2d"),w=cv.width,h=cv.height,R=Math.min(w,h)/2-6,cx=w/2,cy=h/2;
  c.clearRect(0,0,w,h);
  const total=slices.reduce((s,[v])=>s+v,0)||1;
  let a0=-Math.PI/2;
  slices.forEach(([v,col])=>{
    const a1=a0+(v/total)*Math.PI*2;
    c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,R,a0,a1);c.closePath();c.fillStyle=col;c.fill();a0=a1;
  });
  c.globalCompositeOperation="destination-out";
  c.beginPath();c.arc(cx,cy,R*0.62,0,Math.PI*2);c.fill();
  c.globalCompositeOperation="source-over";
  c.fillStyle=getComputedStyle(document.body).getPropertyValue("--ink")||"#000";
  c.font="bold 46px sans-serif";c.textAlign="center";c.fillText(centerText,cx,cy+16);c.textAlign="left";
}
function barChart(cv,vals,labels,colors){
  const dpr=devicePixelRatio||1,w=cv.clientWidth,h=210;
  cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext("2d");c.scale(dpr,dpr);c.clearRect(0,0,w,h);
  const pad={l:34,r:10,t:12,b:28},max=Math.max(1,...vals);
  const bw=(w-pad.l-pad.r)/vals.length;
  vals.forEach((v,i)=>{
    const bh=(h-pad.t-pad.b)*(v/max);
    c.fillStyle=(colors&&colors[i])||"#0b57a4";
    const x=pad.l+i*bw+bw*0.18,y=h-pad.b-bh;
    c.beginPath();c.roundRect(x,y,bw*0.64,bh,6);c.fill();
    c.fillStyle=getComputedStyle(document.body).getPropertyValue("--muted");c.font="10px sans-serif";
    c.textAlign="center";c.fillText(String(labels[i]).slice(0,10),x+bw*0.32,h-10);
    c.fillStyle=getComputedStyle(document.body).getPropertyValue("--ink");c.fillText(v,x+bw*0.32,y-4);
    c.textAlign="left";
  });
}

/* ------------------------------- PRACTICE -------------------------------- */
function collectQuestions(kind){
  const out=[];const seen=new Set();
  const push=(t,q)=>{if(!seen.has(q.id)){seen.add(q.id);out.push({t,q});}};
  const done=S.attempts.filter(a=>a.submittedAt);
  if(kind==="bookmarked"){
    S.tests.forEach(t=>t.questions.forEach(q=>{if(S.bookmarks.includes(q.id))push(t,q);}));
  } else if(kind==="weak"){
    const acc={};done.forEach(a=>{const t=testById(a.testId);if(!t)return;t.questions.forEach(q=>{
      const c=q.chapter||q.subject;const o=acc[c]=acc[c]||{c:0,n:0};o.n++;if(isRight(q,(a.responses[q.id]||{}).ans))o.c++;});});
    const weak=Object.entries(acc).filter(([,v])=>pct(v.c,v.n)<60).map(([k])=>k);
    S.tests.forEach(t=>t.questions.forEach(q=>{if(weak.includes(q.chapter||q.subject))push(t,q);}));
  } else if(kind==="mixed"){
    S.tests.forEach(t=>t.questions.forEach(q=>push(t,q)));
    out.sort(()=>Math.random()-0.5); return out.slice(0,25);
  } else {
    done.forEach(a=>{const t=testById(a.testId);if(!t)return;t.questions.forEach(q=>{
      const r=a.responses[q.id]||{};
      const skipped=r.ans==null||r.ans==="";
      if(kind==="wrong"&&!skipped&&!isRight(q,r.ans))push(t,q);
      if(kind==="skipped"&&skipped)push(t,q);});});
  }
  return out;
}

    const b=el("button","btn sm","Open");b.onclick=()=>go("result",a.id);r.appendChild(b);
    c.appendChild(r);
  });
  root.appendChild(c);
}

/* Premium hero report card: marks ring, overall question analysis, score booster. */
function scoreHero(t,a,r,ai){
  const name=(S.settings.candidate||"Candidate").trim()||"Candidate";
  const total=r.all.correct+r.all.wrong+r.all.skipped;
  const attempted=r.all.correct+r.all.wrong;
  const attAcc=pct(r.all.correct,attempted);
  const p=clamp(r.all.marks/(r.all.max||1),0,1);
  const C=2*Math.PI*66;
  const mood=r.all.percentage>=75?"Outstanding!":r.all.percentage>=50?"Great Going!":r.all.percentage>=30?"Keep Improving!":"Let's Rebuild!";
  const learner=attAcc>=75&&attempted>=total*0.7?"Sharp Shooter":attAcc>=60?"Balanced Learner":attempted>=total*0.8?"Aggressive Attempter":"Cautious Starter";
  const advice=learner==="Sharp Shooter"?"keep your accuracy and push attempt count higher.":
    learner==="Balanced Learner"?"so build coverage and refine your approach to lift accuracy.":
    learner==="Aggressive Attempter"?"so cut risky guesses to stop losing marks to negatives.":
    "so start with high-weight easy chapters to grow your attempt base.";
  const easy=ai.easyMissed.length, easyMarks=easy*4+Math.min(easy,r.all.wrong);
  const wrap=el("div");
  const hero=el("div","sb-hero");
  hero.innerHTML=`<div class="sb-top">
      <div style="min-width:220px;flex:1">
        <div class="sb-hello">Hello ${esc(name)},</div>
        <div class="sb-title">${mood}</div>
        <div class="sb-tag">${ai.percentile}%ile projected · Rank ~${ai.rank.toLocaleString("en-IN")}</div>
      </div>
      <div class="sb-ring">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle cx="75" cy="75" r="66" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="13"/>
          <circle cx="75" cy="75" r="66" fill="none" stroke="#fbbf24" stroke-width="13" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/>
        </svg>
        <div class="lbl"><span>MARKS</span><b>${r.all.marks}</b><i>out of ${r.all.max}</i></div>
      </div>
    </div>
    <div class="sb-oqa">
      <h4>Overall Question Analysis</h4>
      <div class="r">
        <div><div style="opacity:.85;font-size:13px">Total Questions</div><div style="font-size:28px;font-weight:900">${total}</div></div>
        <div style="text-align:right"><div style="opacity:.85;font-size:13px">Attempted</div>
          <div style="font-size:24px;font-weight:900">${attempted} <span style="font-size:14px;opacity:.85">(${pct(attempted,total)}%)</span></div></div>
      </div>
      <div class="sb-bar">
        <i style="width:${pct(r.all.correct,total)}%;background:#22c55e"></i>
        <i style="width:${pct(r.all.wrong,total)}%;background:#ef4444"></i>
        <i style="width:${pct(r.all.skipped,total)}%;background:rgba(255,255,255,.35)"></i>
      </div>
      <div class="sb-legend">
        <span><i class="sb-dot" style="background:#22c55e"></i>Correct ${r.all.correct}</span>
        <span><i class="sb-dot" style="background:#ef4444"></i>Incorrect ${r.all.wrong}</span>
        <span><i class="sb-dot" style="background:rgba(255,255,255,.55)"></i>Unattempted ${r.all.skipped}</span>
        <span><i class="sb-dot" style="background:#fbbf24"></i>Attempt Accuracy ${attAcc}%</span>
      </div>
    </div>`;
  wrap.appendChild(hero);

  const boost=el("div","sb-boost");
  const acts=[
    ["Easy Kill Topics",`This test had <b>${ai.easyMissed.length+ai.hardSolved.length}</b> high-weight questions. You attempted <b>${attempted}</b> and got <b>${r.all.correct}</b> right (${attAcc}% accuracy), but missed about <b>~${easyMarks}</b> potential marks by not converting these key questions.`],
    ["Fix Your Negatives",`<b>${r.all.wrong}</b> wrong answers cost you <b>-${r.all.neg}</b> marks. ${ai.careless.length} of them were answered in under ${fmtTime(Math.round(ai.avgT*0.5))} — slow down on those.`],
    ["Time Reallocation",`Your slowest questions ate ${fmtTime(ai.slow.reduce((x,y)=>x+y.time,0))}. Cap any single question at ${fmtTime(Math.round(ai.avgT*2))} and bank the rest for ${ai.strongSub[ai.strongSub.length-1]}.`]
  ];
  boost.innerHTML=`<div class="in">
      <div class="brand"><em>Ved</em><b>ScoreBooster</b></div>
      <div class="line"><span class="em">🎓</span><div>You scored <b>${r.all.marks}/${r.all.max}</b>. <b>Predicted JEE Main rank ~${ai.rank>=1000?(ai.rank/1000).toFixed(1)+"K":ai.rank}.</b></div></div>
      <div class="line"><span class="em">🎯</span><div>You're a <b>${learner}</b>, ${advice}</div></div>
    </div>
    <div class="sb-actions">
      <div style="font-weight:900;font-size:16px;color:var(--text)">🎯 3 quick actions to gain <span style="color:var(--blue-l)">${Math.max(8,easyMarks)} marks</span> &amp; stay on track</div>
      ${acts.map(([h,b])=>`<div class="sb-action"><h5>${h}</h5><div class="small muted">${b}</div></div>`).join("")}
    </div>`;
  wrap.appendChild(boost);
  return wrap;
}

    const foot=el("div","qrev-foot");
    const bm=el("button","btn sm ghost",S.bookmarks.includes(x.q.id)?"★ Bookmarked":"☆ Bookmark");
    bm.type="button";bm.setAttribute("aria-label",`Bookmark question ${x.q.no}`);
    bm.onclick=()=>{const i=S.bookmarks.indexOf(x.q.id);i<0?S.bookmarks.push(x.q.id):S.bookmarks.splice(i,1);
      save();bm.textContent=S.bookmarks.includes(x.q.id)?"★ Bookmarked":"☆ Bookmark";
      bm.setAttribute("aria-pressed",S.bookmarks.includes(x.q.id)?"true":"false");};
    bm.setAttribute("aria-pressed",S.bookmarks.includes(x.q.id)?"true":"false");
    foot.appendChild(bm);
    const askAi=el("button","btn sm ghost","🤖 Ask AI");
    askAi.type="button";askAi.setAttribute("aria-label",`Ask the AI about question ${x.q.no}`);
    askAi.onclick=()=>askAIAbout(x.q);
    foot.appendChild(askAi);
    d.appendChild(foot);
    return d;
  }

  function draw(){
    list.innerHTML="";
    const pick=ai.rows.filter(x=>{
      if(view.sub!=="All"&&x.q.subject!==view.sub)return false;
      if(view.f==="bookmarked")return S.bookmarks.includes(x.q.id);
      if(view.f!=="all")return x.status===view.f;
      return true;
    });
    if(!pick.length){list.innerHTML=`<p class="muted">Nothing matches this filter.</p>`;return;}
    const groups=view.sub==="All"?subsPresent:[view.sub];
    groups.forEach(s=>{
      const rows=pick.filter(x=>x.q.subject===s);
      if(!rows.length)return;
      const c=rows.filter(x=>x.status==="correct").length,
            w=rows.filter(x=>x.status==="wrong").length,
            sk=rows.filter(x=>x.status==="skipped").length;
      const h=el("div","qrev-group");
      h.innerHTML=`<h4 style="margin:0;color:${SUBCOLOR[s]}">${esc(s)}</h4>
        <div class="qrev-gstats"><span class="ok">${c} correct</span><span class="no">${w} wrong</span><span>${sk} skipped</span></div>`;
      list.appendChild(h);
      rows.forEach(x=>list.appendChild(reviewCard(x)));
    });
    toggleAll.setAttribute("aria-pressed","false");
    toggleAll.textContent="Expand all solutions";
  }
  draw();
  root.appendChild(rc);
}

let EX=null; // {test, attempt, cur, timerId, tick}
const RESUME_KEY="jeecbt.resume";
/** Snapshot the live attempt so a crash, refresh or closed tab loses nothing. */
function examAutosave(){
  if(!EX)return;
  try{localStorage.setItem(RESUME_KEY,JSON.stringify({testId:EX.test.id,attempt:EX.attempt,cur:EX.cur,left:EX.left,
    order:EX.test.questions.map(q=>q.id),at:Date.now()}));}
  catch(e){/* quota — the attempt still lives in memory */}
}
function clearAutosave(){try{localStorage.removeItem(RESUME_KEY);}catch(e){}}
function pendingResume(){
  try{const r=JSON.parse(localStorage.getItem(RESUME_KEY)||"null");
    return r&&r.left>10&&testById(r.testId)?r:null;}catch(e){return null;}
}
function shuffledCopy(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function startExam(testId,resume){
  const base=testById(testId);if(!base)return;
  let t=base;
  if(resume&&resume.order&&resume.order.length===base.questions.length){
    const byId={};base.questions.forEach(q=>byId[q.id]=q);
    const reordered=resume.order.map(id=>byId[id]).filter(Boolean);
    if(reordered.length===base.questions.length)t={...base,questions:reordered};
  } else if(!resume && S.settings.randomizeOrder && !base.practice){
    t={...base,questions:shuffledCopy(base.questions)};
  }
  const attempt=resume?resume.attempt:{id:uid(),testId,startedAt:Date.now(),responses:{},submittedAt:null};
  t.questions.forEach(q=>attempt.responses[q.id]=attempt.responses[q.id]||{ans:null,status:"notvisited",time:0,changes:0});
  EX={test:t,attempt,cur:resume?resume.cur:0,left:resume?resume.left:t.duration,lastTick:Date.now(),warned:{}};
  if(!resume&&t.cloud)registerAttempt(t.id);
  examAutosave();
  $("#examView").classList.remove("hide");
  $("#exTitle").textContent=t.name;
  $("#exCand").textContent=S.settings.candidate;
  buildSubTabs();buildFoot();drawQuestion();startTimer();
  document.body.style.overflow="hidden";
}
function endExamUI(){$("#examView").classList.add("hide");document.body.style.overflow="";clearInterval(EX&&EX.timerId);EX=null;}
function subjectsInTest(){return [...new Set(EX.test.questions.map(q=>q.subject))];}
function buildSubTabs(){
  const w=$("#exSubs");w.innerHTML="";
  subjectsInTest().forEach(s=>{
    const b=el("button",null,s);
    b.onclick=()=>{const i=EX.test.questions.findIndex(q=>q.subject===s);if(i>=0){commitTime();EX.cur=i;drawQuestion();}};
    w.appendChild(b);
  });
}
function syncTabs(){
  const cs=EX.test.questions[EX.cur].subject;
  [...$("#exSubs").children].forEach(b=>b.className=b.textContent===cs?"active":"");
}
function buildFoot(){
  const f=$("#exFoot");f.innerHTML="";
  const mk=(cls,label,fn)=>{const b=el("button","btn "+cls,label);b.onclick=fn;f.appendChild(b);return b;};
  mk("ghost","◀ Previous",()=>move(-1));
  mk("ghost","Clear Response",()=>{const q=cq();const r=res(q);r.ans=null;r.status="notanswered";drawQuestion();});
  mk("purple","Mark for Review & Next",()=>{const r=res(cq());r.status=r.ans?"markedans":"marked";move(1,true);});
  mk("green","Save & Next",()=>{const r=res(cq());r.status=r.ans?"answered":"notanswered";move(1,true);});
  mk("ghost","Next ▶",()=>move(1));
  const sp=el("div");sp.style.flex="1";f.appendChild(sp);
  mk("red","Submit Test",()=>confirmBox("Submit test?",summaryHTML(),()=>submitExam(false),"Submit"));
}
const cq=()=>EX.test.questions[EX.cur];
const res=q=>EX.attempt.responses[q.id];
function commitTime(){
  const now=Date.now(); const q=cq(); if(q) res(q).time+=(now-EX.lastTick)/1000;
  EX.lastTick=now;
}
function move(d,keep){
  commitTime();
  const n=EX.cur+d;
  if(n<0||n>=EX.test.questions.length){if(keep)toast("End of paper");return;}
  EX.cur=n;drawQuestion();
}
function drawQuestion(){
  const q=cq(),r=res(q);
  if(r.status==="notvisited")r.status=r.ans?"answered":"notanswered";
  EX.lastTick=Date.now();
  const p=$("#exQ");p.innerHTML="";
  const head=el("div","row");head.style.justifyContent="space-between";
  const negTxt=S.settings.negMarking===false?"+4 / 0":"+4 / -1";
  const diff=questionDifficulty(q.id);
  const diffColor={Easy:"var(--green)",Medium:"var(--amber)",Hard:"var(--red)",Unrated:"var(--muted)"}[diff.label];
  const diffBg={Easy:"rgba(30,158,87,.15)",Medium:"rgba(224,161,6,.16)",Hard:"rgba(211,59,59,.15)",Unrated:"rgba(107,107,133,.14)"}[diff.label];
  head.innerHTML=`<div><b>Question ${q.no}</b> <span class="chip" style="color:${SUBCOLOR[q.subject]}">${esc(q.subject)}</span>
    <span class="badge">${q.type==="mcq"?"Single Correct ("+negTxt+")":"Numerical ("+negTxt+")"}</span>
    <span class="badge" style="background:${diffBg};color:${diffColor}" title="${diff.n} attempt(s) across all students">${diff.label}${diff.acc!=null?" · "+diff.acc+"%":""}</span></div>
    <div class="small muted">${EX.cur+1} of ${EX.test.questions.length}</div>`;
  p.appendChild(head);
  const box=el("div","card");box.style.margin="10px 0";
  box.appendChild(imgTag(q.img,"qimg",q.text));
  if(q.type==="mcq"){
    q.options.forEach(o=>{
      const row=el("div","optrow"+(r.ans===o.label?" sel":""));
      row.appendChild(el("div","optlab",o.label.toUpperCase()));
      const w=el("div");w.style.flex="1";w.appendChild(imgTag(o.img,"qimg",o.text));row.appendChild(w);
      row.onclick=()=>{if(r.ans!==o.label)r.changes++;r.ans=o.label;
        if(r.status!=="marked"&&r.status!=="markedans")r.status="answered";else r.status="markedans";
        drawQuestion();};
      box.appendChild(row);
    });
  } else {
    const inp=el("input");inp.type="text";inp.inputMode="decimal";inp.placeholder="Enter numerical answer";
    inp.value=r.ans==null?"":r.ans;inp.style.marginTop="10px";inp.style.width="240px";
    inp.oninput=()=>{r.changes++;r.ans=inp.value.trim()||null;paintPalette();};
    box.appendChild(inp);
  }
  p.appendChild(box);
  syncTabs();paintPalette();
}
function counts(){
  const c={answered:0,notanswered:0,marked:0,markedans:0,notvisited:0};
  EX.test.questions.forEach(q=>{const r=res(q);
    const st=r.status==="notvisited"?"notvisited":(r.status==="marked"||r.status==="markedans")?
      (r.ans?"markedans":"marked"):(r.ans?"answered":"notanswered");
    c[st]++;});
  return c;
}
function paintPalette(){
  const p=$("#exPal");const c=counts();
  p.innerHTML=`<div class="legend">
    <span><i class="dot" style="background:var(--green)"></i>Answered ${c.answered}</span>
    <span><i class="dot" style="background:var(--red)"></i>Not Answered ${c.notanswered}</span>
    <span><i class="dot" style="background:var(--purple)"></i>Marked ${c.marked+c.markedans}</span>
    <span><i class="dot" style="background:var(--panel)"></i>Not Visited ${c.notvisited}</span>
  </div>`;
  subjectsInTest().forEach(s=>{
    p.appendChild(el("div","small muted",`<b style="color:${SUBCOLOR[s]}">${s}</b>`));
    const g=el("div","pal-grid");g.style.margin="6px 0 12px";
    EX.test.questions.forEach((q,i)=>{
      if(q.subject!==s)return;
      const r=res(q);
      const st=r.status==="notvisited"?"":(r.status==="marked"||r.status==="markedans")?
        (r.ans?"markedans":"marked"):(r.ans?"answered":"notanswered");
      const b=el("button","pnum "+st+(i===EX.cur?" cur":""),String(q.no));
      b.onclick=()=>{commitTime();EX.cur=i;drawQuestion();};
      g.appendChild(b);
    });
    p.appendChild(g);
  });
  examAutosave();
}
function summaryHTML(){
  const c=counts();
  return `Answered <b>${c.answered+c.markedans}</b> · Not answered <b>${c.notanswered}</b> ·
   Marked for review <b>${c.marked+c.markedans}</b> · Not visited <b>${c.notvisited}</b>.<br>
   Time left <b>${fmtTime(EX.left)}</b>. You cannot change answers after submitting.`;
}
function startTimer(){
  const t=$("#exTimer");
  const upd=()=>{
    EX.left--;
    t.textContent=fmtTime(EX.left);
    t.className="timer"+(EX.left<=300?" crit":EX.left<=1800?" warn":"");
    [[1800,"30 minutes remaining"],[600,"10 minutes remaining"],[300,"5 minutes remaining"],[60,"1 minute remaining"]]
      .forEach(([s,m])=>{if(EX.left===s&&!EX.warned[s]){EX.warned[s]=1;toast("⚠ "+m,4000);}});
    if(EX.left%5===0){commitTime();examAutosave();}
    if(EX.left<=0)submitExam(true);
  };
  t.textContent=fmtTime(EX.left);
  EX.timerId=setInterval(upd,1000);
}
function submitExam(auto){
  commitTime();
  const {test,attempt}=EX;
  attempt.submittedAt=Date.now();
  attempt.timeTaken=(attempt.submittedAt-attempt.startedAt)/1000;
  attempt.autoSubmitted=!!auto;
  attempt.result=evaluate(test,attempt.responses);
  Object.values(attempt.responses).forEach(r=>r.time=Math.round(r.time));
  S.attempts.push(attempt);
  S.studyLog[todayKey(Date.now())]=(S.studyLog[todayKey(Date.now())]||0)+1;
  const attemptedCount=Object.values(attempt.responses).filter(r=>r.ans!=null&&r.ans!=="").length;
  const dk=todayKey(Date.now());
  S.dailyQuestions[dk]=(S.dailyQuestions[dk]||0)+attemptedCount;
  const pl=PLAN().find(p=>!p.done&&todayKey(p.date)===todayKey(Date.now()));
  if(pl)setPlannerDone(pl,true);
  save();clearAutosave();
  const id=attempt.id;
  endExamUI();
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  toast(auto?"Time up — test auto submitted":"Test submitted");
  go("result",id);
}

   8. STUDY INTELLIGENCE — streaks, mastery, notebook, revision videos
   ========================================================================== */
function streakInfo(){
  const days=[];let streak=0;
  for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);days.push({key:todayKey(d),label:"SMTWTFS"[d.getDay()],on:!!S.studyLog[todayKey(d)]});}
  for(let i=0;i<400;i++){const d=new Date();d.setDate(d.getDate()-i);
    if(S.studyLog[todayKey(d)])streak++;else if(i>0)break;}
  const week=days.filter(d=>d.on).length;
  const heat=[];
  for(let i=89;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=todayKey(d);
    heat.push({key:k,count:S.dailyQuestions[k]||0,attempts:S.studyLog[k]||0});}
  return {days:days.reverse(),streak,week,heat};
}
/* Per-question difficulty, derived from real attempt history across every
   test (not a manual tag) — a question only gets a level once at least 4
   people/attempts have answered it, otherwise it's shown as "Unrated". */
function questionDifficulty(qid){
  let c=0,n=0;
  S.attempts.filter(a=>a.submittedAt).forEach(a=>{
    const r=a.responses[qid];if(!r||r.ans==null||r.ans==="")return;
    const t=testById(a.testId);const q=t&&t.questions.find(x=>x.id===qid);
    if(!q)return; n++; if(isRight(q,r.ans))c++;
  });
  if(n<4)return {label:"Unrated",acc:null,n};
  const acc=pct(c,n);
  return {label:acc>=70?"Easy":acc>=40?"Medium":"Hard",acc,n};
}
function chapterMastery(){
  const acc={};
  S.attempts.filter(a=>a.submittedAt).forEach(a=>{
    const t=testById(a.testId);if(!t)return;
    t.questions.forEach(q=>{
      const key=q.chapter||q.subject;const o=acc[key]=acc[key]||{c:0,n:0,sub:q.subject,time:0};
      const r=a.responses[q.id]||{};o.n++;o.time+=r.time||0;if(isRight(q,r.ans))o.c++;});});
  return Object.entries(acc).map(([name,v])=>({name,sub:v.sub,n:v.n,acc:pct(v.c,v.n),
    level:pct(v.c,v.n)>=85?"Mastered":pct(v.c,v.n)>=70?"Strong":pct(v.c,v.n)>=50?"Developing":"Needs work"}))
    .sort((a,b)=>a.acc-b.acc);
}
function wrongQuestions(){
  const out=[];const seen=new Set();
  S.attempts.filter(a=>a.submittedAt).slice().reverse().forEach(a=>{
    const t=testById(a.testId);if(!t)return;
    t.questions.forEach(q=>{
      const r=a.responses[q.id]||{};
      if(r.ans==null||r.ans===""||isRight(q,r.ans))return;
      if(seen.has(q.id))return;seen.add(q.id);
      out.push({q,t,ans:r.ans,when:a.submittedAt,time:r.time||0});});});
  return out;
}

/** Deletes a published test's DB row and its uploaded PDFs/images from cloud
    storage, freeing that quota. Local attempts/bookmarks for it stay put
    (they're just history) but the test itself leaves the public library. */
async function deletePublicTest(t){
  confirmBox("Delete this test?",
    `<b>${esc(t.name)}</b> (${t.questions.length} questions) will be permanently removed from the public library and cloud storage. This can't be undone.`,
    async()=>{
      try{
        toast("Deleting…",1500);
        const paths=new Set([`${t.id}/source/physics.pdf`,`${t.id}/source/chemistry.pdf`,`${t.id}/source/mathematics.pdf`]);
        t.questions.forEach(q=>{
          [q.img,q.solImg,...(q.options||[]).map(o=>o.img)].forEach(k=>{
            if(k&&k.startsWith("cloud:"))paths.add(k.slice(6));
          });
        });
        await Promise.all([...paths].map(p=>
          cloudFetch("/storage/v1/object/public-tests/"+objectPath(p),{method:"DELETE"}).catch(()=>{})
        ));
        const delRes=await cloudFetch("/rest/v1/public_tests?id=eq."+encodeURIComponent(t.id),
          {method:"DELETE",headers:{"Prefer":"return=representation"}});
        const deletedRows=await delRes.json().catch(()=>null);
        if(!deletedRows||!deletedRows.length){
          throw new Error("The server didn't actually delete it (0 rows removed) — this is a Supabase Row Level Security permission issue, not a bug in this page. See the message below for the fix.");
        }
        cloudTests=cloudTests.filter(x=>x.id!==t.id);
        S.tests=S.tests.filter(x=>x.id!==t.id);
        imgPut(LIB_CACHE,cloudTests).catch(()=>{});
        toast("Test deleted — cloud storage freed");render();
      }catch(e){
        toast("Couldn't delete: "+e.message,7000);
        confirmBox("Delete blocked by database permissions",
          `Supabase's Row Level Security is rejecting the delete for the public key this app uses. To fix it once, open your Supabase project → SQL Editor → run:<br><br>
          <code style="display:block;background:var(--paper);padding:10px;border-radius:8px;margin:8px 0;white-space:pre-wrap;font-size:12px">CREATE POLICY "Allow public delete" ON public.public_tests FOR DELETE USING (true);</code>
          Then, in Storage → Policies for the <b>public-tests</b> bucket, add a DELETE policy allowing the same. After that, deleting from this page will work permanently — this only needs to be done once.`,
          ()=>{},"Got it");
      }
    },"Delete permanently");
}

  // recent performance

  }else{

    setTimeout(()=>lineChart(cv,list.map(a=>a.result.all.marks),list.map(a=>(testById(a.testId)||{}).name||"Test"),"Marks",

    const tb=el("table");tb.innerHTML=`<tr><th>Date</th><th>Test</th><th>Marks</th><th>Accuracy</th><th></th></tr>`;

      const tr=el("tr");
      tr.innerHTML=`<td>${fmtDate(a.submittedAt)}</td><td>${esc((testById(a.testId)||{}).name||"—")}</td>
        <td><b>${a.result.all.marks}</b>/${a.result.all.max}</td><td>${a.result.all.accuracy}%</td><td></td>`;
      const b=el("button","btn sm ghost","Analysis");b.onclick=()=>go("result",a.id);tr.lastElementChild.appendChild(b);
      tb.appendChild(tr);

}

/* Offline mode: register the generated worker only in a real published tab.
   Never in dev, never inside the Lovable preview iframe, and ?sw=off cleans up. */
(function registerOfflineWorker(){
  if(!("serviceWorker" in navigator))return;
  const h=location.hostname, inFrame=window.top!==window.self;
  const blocked=inFrame||location.search.includes("sw=off")||
    /^(localhost|127\.0\.0\.1)$/.test(h)||h.startsWith("id-preview--")||h.startsWith("preview--")||
    /(^|\.)lovableproject\.com$/.test(h)||/(^|\.)lovableproject-dev\.com$/.test(h)||
    /(^|\.)beta\.lovable\.dev$/.test(h);
  if(blocked){
    navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{
      if(r.active&&r.active.scriptURL.endsWith("/sw.js"))r.unregister();}));
    return;
  }
  addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
})();

/* ------------------------- AI DOUBT-SOLVER CHAT --------------------------
   Global floating widget, available on every screen except the live exam
   (it sits at a lower z-index than #examView, so the full-screen exam
   overlay covers it automatically — no separate "disable during test"
   logic needed). Talks to /api/public/ai-chat (Gemini). Opens as a true
   full-screen panel — like a native chat app — with an unmissable close
   button, Escape-to-close, and locked background scroll, so open/close
   is always unambiguous. Accepts a photo OR a PDF of a question, and
   remembers the conversation across visits (this device only). ---- */
const AICHAT_LS="jeecbt.aichat.v1";
let aiChatHistory=load_aiChatHistory(); // {role:"user"|"model", text, image?:{mimeType,data,previewUrl,fileName,isImage}, pending?}
let aiChatPendingFile=null; // {mimeType,data,previewUrl?,fileName,isImage} staged but not yet sent
function load_aiChatHistory(){
  try{const v=JSON.parse(localStorage.getItem(AICHAT_LS)||"[]");return Array.isArray(v)?v.slice(-40):[];}
  catch(e){return [];}
}
function save_aiChatHistory(){
  try{localStorage.setItem(AICHAT_LS,JSON.stringify(aiChatHistory.filter(m=>!m.pending).slice(-40)));}catch(e){}
}
/** Minimal, dependency-free markdown → safe HTML: **bold**, `code`,
 *  "- "/"1. " lists, and paragraph breaks. Text is HTML-escaped first, so
 *  this can never inject markup the model didn't intend as formatting. */
function mdLite(raw){
  const lines=esc(raw).split(/\n/);
  let html="", inUl=false, inOl=false;
  const closeLists=()=>{if(inUl){html+="</ul>";inUl=false;}if(inOl){html+="</ol>";inOl=false;}};
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+?)`/g,"<code>$1</code>");
  lines.forEach(line=>{
    const t=line.trim();
    if(/^[-*]\s+/.test(t)){if(!inUl){closeLists();html+="<ul>";inUl=true;}html+="<li>"+inline(t.replace(/^[-*]\s+/,""))+"</li>";}
    else if(/^\d+[.)]\s+/.test(t)){if(!inOl){closeLists();html+="<ol>";inOl=true;}html+="<li>"+inline(t.replace(/^\d+[.)]\s+/,""))+"</li>";}
    else if(!t){closeLists();html+="<br>";}
    else{closeLists();html+=inline(line)+"<br>";}
  });
  closeLists();
  return html;
}
const AI_AVATAR_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>';
const AI_FILE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"/><path d="M14 2v6h6"/></svg>';
const AI_STARTERS=["Explain Newton's third law with an example","Solve: \u222B x\u00b7e^x dx step by step","How should I revise for JEE in the last month?"];
function aiChatRenderMsgs(){
  const box=$("#aiChatMsgs"); if(!box)return; box.innerHTML="";
  if(!aiChatHistory.length){
    const empty=el("div","ai-empty");
    empty.innerHTML=`<span class="ai-avatar">${AI_AVATAR_SVG}</span><h4>Hi! I'm Saarthi 👋</h4>
      <p>Your AI study buddy — ask any Physics, Chemistry or Maths doubt, or attach a 📎 photo or PDF of a question.</p>`;
    const starters=el("div","ai-starters");
    AI_STARTERS.forEach(s=>{
      const b=el("button",null,"💬&nbsp; "+esc(s));b.type="button";b.onclick=()=>{$("#aiChatInput").value=s;aiChatSend();};
      starters.appendChild(b);
    });
    empty.appendChild(starters);
    box.appendChild(empty);
  }
  aiChatHistory.forEach(m=>{
    const row=el("div","ai-msg-row "+m.role);
    if(m.role==="model") row.appendChild(el("span","ai-avatar",AI_AVATAR_SVG));
    const b=el("div","ai-msg "+m.role);
    if(m.image){
      if(m.image.isImage&&m.image.previewUrl){const im=el("img","ai-thumb");im.src=m.image.previewUrl;im.alt="Attached question photo";b.appendChild(im);}
      else if(!m.image.isImage){const chip=el("div","ai-file-chip");chip.innerHTML=AI_FILE_SVG+`<span>${esc(m.image.fileName||"attached file")}</span>`;b.appendChild(chip);}
    }
    if(m.pending&&!m.text) b.appendChild(el("span","ai-typing","<i></i><i></i><i></i>"));
    else if(m.role==="model") b.innerHTML+=mdLite(m.text||"");
    else b.appendChild(document.createTextNode(m.text||""));
    row.appendChild(b);
    box.appendChild(row);
  });
  box.scrollTop=box.scrollHeight;
}
function aiChatRenderChips(){
  const box=$("#aiChatChips"); if(!box)return; box.innerHTML="";
  const last=aiChatHistory[aiChatHistory.length-1];
  if(!last||last.role!=="model"||last.pending) return;
  ["Explain more simply","Give me a similar question","Show the key formula"].forEach(c=>{
    const b=el("button",null,c);b.type="button";b.onclick=()=>{$("#aiChatInput").value=c;aiChatSend();};
    box.appendChild(b);
  });
}
let aiChatIsOpen=false;
function aiChatOpen(){
  const p=$("#aiChatPanel");if(!p)return;
  p.classList.remove("hide"); aiChatIsOpen=true;
  $("#aiChatBtn").classList.add("hide"); $("#aiChatBtn").classList.remove("pulse");
  document.body.style.overflow="hidden"; // lock background scroll behind the full-screen panel
  aiChatRenderMsgs(); aiChatRenderChips();
  // NOTE: deliberately not auto-focusing the input — on phones that pops the
  // keyboard immediately, and the first tap on Close then just dismisses the
  // keyboard instead of registering, making the panel feel "stuck open".
}
function aiChatClose(){
  const p=$("#aiChatPanel"); if(!p)return;
  p.classList.add("hide"); aiChatIsOpen=false;
  $("#aiChatBtn").classList.remove("hide");
  document.body.style.overflow="";
  $("#aiChatInput").blur();
}
/** Opens the chat prefilled with a question's full context — wired to the
 *  "🤖 Ask AI" buttons in the post-test review and mistake notebook. */
function askAIAbout(q){
  const parts=[`I want this JEE question explained (${q.subject}, Q${q.no}):`, q.text];
  if((q.options||[]).length) parts.push("Options: "+q.options.map(o=>`${o.label.toUpperCase()}) ${o.text}`).join("   "));
  if(q.answer) parts.push("Correct answer: "+String(q.answer).toUpperCase());
  parts.push("Please explain the underlying concept and walk through the solution step by step, simply.");
  $("#aiChatInput").value=parts.join("\n");
  aiChatOpen();
  aiChatSyncSend();
}
function aiChatSyncSend(){
  const sendBtn=$("#aiChatSend"), input=$("#aiChatInput");
  if(sendBtn&&input) sendBtn.disabled=!((input.value||"").trim()||aiChatPendingFile);
}
/** Stages a photo OR PDF for the next message. Images get a thumbnail
 *  preview; other files (PDFs) get a filename chip instead, since they
 *  can't be rendered as an <img>. */
function aiChatSetFile(file){
  const isImage=(file.type||"").startsWith("image/");
  const isPdf=(file.type||"").includes("pdf")||/\.pdf$/i.test(file.name||"");
  if(!isImage&&!isPdf){ toast("Only images or PDFs can be attached here"); return; }
  const reader=new FileReader();
  reader.onload=()=>{
    const dataUrl=String(reader.result);
    aiChatPendingFile={mimeType:file.type||(isPdf?"application/pdf":"image/jpeg"),data:dataUrl.split(",")[1]||"",
      previewUrl:isImage?dataUrl:null,fileName:file.name||"attachment",isImage};
    const prev=$("#aiChatImgPrev");prev.classList.remove("hide");prev.innerHTML="";
    const wrap=el("div","thumb-wrap");
    if(isImage){const im=el("img");im.src=dataUrl;im.alt="Photo to send";wrap.appendChild(im);}
    else{const chip=el("div","filechip");chip.innerHTML=AI_FILE_SVG+`<span>${esc(file.name||"document.pdf")}</span>`;wrap.appendChild(chip);}
    const rm=el("button","","✕");rm.type="button";rm.setAttribute("aria-label","Remove attached file");
    rm.onclick=()=>{aiChatPendingFile=null;prev.classList.add("hide");prev.innerHTML="";aiChatSyncSend();};
    wrap.appendChild(rm);
    prev.appendChild(wrap);
    aiChatSyncSend();
  };
  reader.readAsDataURL(file);
}
async function aiChatSend(){
  const inp=$("#aiChatInput"); const text=(inp.value||"").trim();
  const file=aiChatPendingFile;
  if(!text&&!file) return;
  inp.value=""; inp.style.height=""; aiChatSyncSend();
  const prev=$("#aiChatImgPrev"); prev.classList.add("hide"); prev.innerHTML=""; aiChatPendingFile=null;
  aiChatHistory.push({role:"user",text:text||(file&&file.isImage?"(photo attached)":"(file attached)"),
    image:file?{previewUrl:file.previewUrl,fileName:file.fileName,isImage:file.isImage}:null});
  const modelMsg={role:"model",text:"",pending:true};
  aiChatHistory.push(modelMsg);
  aiChatRenderMsgs(); $("#aiChatChips").innerHTML="";
  try{
    const payloadMsgs=aiChatHistory.filter(m=>!m.pending).slice(-16).map(m=>({role:m.role,text:m.text}));
    if(file) payloadMsgs[payloadMsgs.length-1].image={mimeType:file.mimeType,data:file.data};
    const r=await fetch("/api/public/ai-chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages:payloadMsgs})});
    const data=await r.json().catch(()=>null);
    modelMsg.text=(r.ok&&data&&data.reply)?data.reply:((data&&data.error)||"Sorry, I couldn't get a reply just now — please try again.");
  }catch(e){
    modelMsg.text="Network error — please check your connection and try again.";
  }
  modelMsg.pending=false;
  aiChatRenderMsgs(); aiChatRenderChips(); save_aiChatHistory();
}
(function initAiChat(){
  const btn=$("#aiChatBtn"), closeBtn=$("#aiChatClose"), resetBtn=$("#aiChatReset"),
        sendBtn=$("#aiChatSend"), input=$("#aiChatInput"), attachBtn=$("#aiChatAttach"), fileInp=$("#aiChatFile");
  if(!btn) return;
  if(aiChatHistory.length) btn.classList.remove("pulse"); // returning user — skip the "look here" cue
  btn.onclick=aiChatOpen;
  closeBtn.onclick=aiChatClose;
  resetBtn.onclick=()=>{aiChatHistory=[];save_aiChatHistory();aiChatRenderMsgs();$("#aiChatChips").innerHTML="";};
  sendBtn.onclick=aiChatSend;
  attachBtn.onclick=()=>fileInp.click();
  fileInp.onchange=()=>{if(fileInp.files&&fileInp.files[0])aiChatSetFile(fileInp.files[0]);fileInp.value="";};
  input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();aiChatSend();}});
  input.addEventListener("input",()=>{input.style.height="";input.style.height=Math.min(120,input.scrollHeight)+"px";aiChatSyncSend();});
  // Escape closes the panel from anywhere — a second, always-reliable way out
  // besides tapping the header's close button.
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&aiChatIsOpen)aiChatClose();});
  aiChatSyncSend();
})();
</script>
